lass=\"study-details\">\u003csummary>Cell 43 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>\nsns.regplot(y=&#x27;Calories_kcal&#x27;,\n            x=&#x27;Water_g&#x27;,\n            data=df_food,\n            ci=None)\n\nplt.show()\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"44\">\u003cspan class=\"archive-cell-label\" dir=\"ltr\">Cell 44 / 99 · markdown\u003c/span>\u003cdiv class=\"archive-text\" lang=\"en\" dir=\"ltr\">\u003ch4>What are the possible drawbacks of a zero-carb diet? \u003c/h4>\u003c/div>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"45\">\u003cdetails class=\"study-details\">\u003csummary>Cell 45 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>ZeroCarb = df_food_No[df_food_No[&#x27;Carbohydrate_g&#x27; ]== 0.0]\nZeroCarb.info()\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"46\">\u003cdetails class=\"study-details\">\u003csummary>Cell 46 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>ZeroCarb[[&#x27;Calories_kcal&#x27;,&#x27;Total fat_g&#x27;, &#x27;Cholesterol_mg&#x27;]].mean()\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"47\">\u003cdetails class=\"study-details\">\u003csummary>Cell 47 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>df_food_No[[&#x27;Calories_kcal&#x27;,&#x27;Total fat_g&#x27;, &#x27;Cholesterol_mg&#x27;]].mean()\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"48\">\u003cspan class=\"archive-cell-label\" dir=\"ltr\">Cell 48 / 99 · markdown\u003c/span>\u003cdiv class=\"archive-text\" lang=\"en\" dir=\"ltr\">\u003ch4>What could be the drawbacks of a very high-protein diet?\u003c/h4>\u003c/div>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"49\">\u003cdetails class=\"study-details\">\u003csummary>Cell 49 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>Top_500_high_protein = df_food_No.sort_values(&#x27;Protein_g&#x27;,ascending=False).head(500)\nTop_500_high_protein.sort_values(&#x27;Cholesterol_mg&#x27;,ascending=False)\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"50\">\u003cdetails class=\"study-details\">\u003csummary>Cell 50 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>Top_500_high_protein[[&#x27;Calories_kcal&#x27;,&#x27;Total fat_g&#x27;, &#x27;Cholesterol_mg&#x27;]].mean()\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"51\">\u003cspan class=\"archive-cell-label\" dir=\"ltr\">Cell 51 / 99 · markdown\u003c/span>\u003cdiv class=\"archive-text\" lang=\"en\" dir=\"ltr\">\u003ch4>Descriptive cholesterol comparison\u003c/h4>\nThese selected food groups have different cholesterol levels in this dataset. This comparison cannot establish disease risk or clinical diet effects.\u003c/div>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"52\">\u003cspan class=\"archive-cell-label\" dir=\"ltr\">Cell 52 / 99 · markdown\u003c/span>\u003cdiv class=\"archive-text\" lang=\"en\" dir=\"ltr\">\u003ch4>According to the Cleveland Clinic website, a gram of fat has around 9 kilocalories, and a gram of protein and a gram of carbohydrate contain 4 kilocalories each. Fit a linear model to test whether these estimates agree with the data.\u003c/h4>\u003c/div>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"53\">\u003cdetails class=\"study-details\">\u003csummary>Cell 53 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>NoZeroCal = df_food_No[df_food_No[&#x27;Calories_kcal&#x27;] != 0.0]\nNoZeroCal[&#x27;Fat_g&#x27;] = NoZeroCal[&#x27;Total fat_g&#x27;]\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"54\">\u003cdetails class=\"study-details\">\u003csummary>Cell 54 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>NoZeroCal.info()\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"55\">\u003cspan class=\"archive-cell-label\" dir=\"ltr\">Cell 55 / 99 · markdown\u003c/span>\u003cdiv class=\"archive-text\" lang=\"en\" dir=\"ltr\">Now,time to the model.\nFit a linear model to test whether these estimates agree with the data.\u003c/div>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"56\">\u003cdetails class=\"study-details\">\u003csummary>Cell 56 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>\nfrom statsmodels.formula.api import ols\n# Fit the model\nmdl_calories_vs_P_F_C = ols(&#x27;Calories_kcal ~ Protein_g + Fat_g + Carbohydrate_g + 0&#x27;, data=NoZeroCal).fit()\n\n# Create the explanatory data\nexplanatory_dataPFC = pd.DataFrame({&#x27;Protein_g&#x27;: [1, 0, 0,0,10,5.88,200],\n                                   &#x27;Fat_g&#x27;: [0, 1, 0,0,20,13.24,100],\n                                   &#x27;Carbohydrate_g&#x27;: [0, 0, 1,0,15,41.18,100]})\n# Predict &#x27;Calories_kcal&#x27;\nprediction_data = explanatory_dataPFC.assign(Calories_kcal=mdl_calories_vs_P_F_C.predict(explanatory_dataPFC))\n\n# Calculate MSE and RSE\nmse = mdl_calories_vs_P_F_C.mse_resid\nrse = np.sqrt(mse)\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"57\">\u003cdetails class=\"study-details\">\u003csummary>Cell 57 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>df_food_No.iloc[0][3:7]\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"58\">\u003cdetails class=\"study-details\">\u003csummary>Cell 58 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>print(mdl_calories_vs_P_F_C.params)\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"59\">\u003cdetails class=\"study-details\">\u003csummary>Cell 59 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>explanatory_dataPFC\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"60\">\u003cdetails class=\"study-details\">\u003csummary>Cell 60 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>print(mdl_calories_vs_P_F_C.rsquared)\nprint(mdl_calories_vs_P_F_C.rsquared_adj)\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"61\">\u003cspan class=\"archive-cell-label\" dir=\"ltr\">Cell 61 / 99 · markdown\u003c/span>\u003cdiv class=\"archive-text\" lang=\"en\" dir=\"ltr\">\u003ch4>Analyze the errors of your linear model to see what could be the hidden sources of calories in food.\u003c/h4>\u003c/div>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"62\">\u003cdetails class=\"study-details\">\u003csummary>Cell 62 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>print(&#x27;MSE :&#x27;, mse)\nprint(&#x27;RSE :&#x27;, rse)\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"63\">\u003cdetails class=\"study-details\">\u003csummary>Cell 63 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>prediction_data\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"64\">\u003cdetails class=\"study-details\">\u003csummary>Cell 64 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>\nplt.figure()\nsns.regplot(y=&#x27;Calories_kcal&#x27;,\n            x=&#x27;Protein_g&#x27;,\n            data=NoZeroCal,\n            ci=None,\n            scatter_kws={&#x27;alpha&#x27;: 0.5},\n            color=sns.color_palette(&quot;deep&quot;)[0],\n            label=&#x27;Protein&#x27;)\nsns.regplot(y=&#x27;Calories_kcal&#x27;,\n            x=&#x27;Fat_g&#x27;,\n            data=NoZeroCal,\n            ci=None,\n            scatter_kws={&#x27;alpha&#x27;: 0.5},\n            color=sns.color_palette(&quot;deep&quot;)[1],\n            label=&#x27;Fat&#x27;)\nsns.regplot(y=&#x27;Calories_kcal&#x27;,\n            x=&#x27;Carbohydrate_g&#x27;,\n            data=NoZeroCal,\n            ci=None,\n            scatter_kws={&#x27;alpha&#x27;: 0.5},\n            color=sns.color_palette(&quot;deep&quot;)[2],\n            label=&#x27;Carbohydrate&#x27;)\n\nplt.xlabel(&#x27;Grams&#x27;)\nplt.ylabel(&#x27;Calories (kcal)&#x27;)\nplt.legend()\nplt.show()\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"65\">\u003cdetails class=\"study-details\">\u003csummary>Cell 65 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>NoZeroCal\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"66\">\u003cdetails class=\"study-details\">\u003csummary>Cell 66 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>\nfrom statsmodels.formula.api import ols\n# Fit the model\nmdl_calories_vs_P_F_C_cat = ols(&#x27;Calories_kcal ~ Protein_g + Fat_g + Carbohydrate_g + Category + Category : Protein_g + Category:Fat_g + Category : Carbohydrate_g + 0&#x27;, data=NoZeroCal).fit()\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"67\">\u003cdetails class=\"study-details\">\u003csummary>Cell 67 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>from itertools import product \u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"68\">\u003cdetails class=\"study-details\">\u003csummary>Cell 68 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>catList = list(NoZeroCal[&#x27;Category&#x27;].unique())\nproteinList = np.arange(0,50,10)\nfatList = np.arange(0,50,10)\ncarbohydrateList = np.arange(0,50,10)\n\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"69\">\u003cdetails class=\"study-details\">\u003csummary>Cell 69 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>p = product(catList, proteinList, fatList, carbohydrateList)\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"70\">\u003cdetails class=\"study-details\">\u003csummary>Cell 70 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>\nexplanatoryDataPFCcat = pd.DataFrame(p,\n    columns=[&quot;Category&quot;,\n&quot;Protein_g&quot;,\n&quot;Fat_g&quot;,\n&quot;Carbohydrate_g&quot;])\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"71\">\u003cdetails class=\"study-details\">\u003csummary>Cell 71 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>explanatoryDataPFCcat\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"72\">\u003cdetails class=\"study-details\">\u003csummary>Cell 72 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>mse1 = mdl_calories_vs_P_F_C_cat.mse_resid\nrse1 = np.sqrt(mse1)\nprint(mdl_calories_vs_P_F_C_cat.rsquared_adj)\nprint(mdl_calories_vs_P_F_C_cat.rsquared)\nprint(&quot;MSE:&quot;,mse1)\nprint(&quot;RSE:&quot;,rse1)\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"73\">\u003cdetails class=\"study-details\">\u003csummary>Cell 73 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>predictionData = explanatoryDataPFCcat.assign(\n    Calories_kcal = mdl_calories_vs_P_F_C_cat.predict(explanatoryDataPFCcat)\n)\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"74\">\u003cdetails class=\"study-details\">\u003csummary>Cell 74 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>predictionData\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"75\">\u003cdetails class=\"study-details\">\u003csummary>Cell 75 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>predp = predictionData[predictionData[&#x27;Protein_g&#x27;] == 10] \npredf = predictionData[predictionData[&#x27;Fat_g&#x27;] == 10] \npredcarb = predictionData[predictionData[&#x27;Carbohydrate_g&#x27;] == 10] \u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"76\">\u003cdetails class=\"study-details\">\u003csummary>Cell 76 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>predpZeroF = predp[predp[&#x27;Fat_g&#x27;] == 0]\npredfZeroP = predf[predf[&#x27;Protein_g&#x27;] == 0]\npredcarbZeroP = predcarb[predcarb[&#x27;Protein_g&#x27;] == 0]\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"77\">\u003cdetails class=\"study-details\">\u003csummary>Cell 77 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>predpZeroFZeroCarb = predpZeroF[predpZeroF[&#x27;Carbohydrate_g&#x27;] == 0]\npredfZeroPZeroCarb = predfZeroP[predfZeroP[&#x27;Carbohydrate_g&#x27;] == 0]\npredcarbZeroPZeroF = predcarbZeroP[predcarbZeroP[&#x27;Fat_g&#x27;] == 0]\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"78\">\u003cdetails class=\"study-details\">\u003csummary>Cell 78 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>print(&quot;Calories mean in 10 gm protein:&quot;,predpZeroFZeroCarb[&quot;Calories_kcal&quot;].mean())\nprint(&quot;Calories mean in 10 gm Fat:&quot;,predfZeroPZeroCarb[&quot;Calories_kcal&quot;].mean())\nprint(&quot;Calories mean in 10 gm carbohydrates :&quot;,predcarbZeroPZeroF[&quot;Calories_kcal&quot;].mean())\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"79\">\u003cspan class=\"archive-cell-label\" dir=\"ltr\">Cell 79 / 99 · markdown\u003c/span>\u003cdiv class=\"archive-text\" lang=\"en\" dir=\"ltr\">\u003ch4>the last model is better that the first and it doesn&#x27;t work with very small amount of fat , carbohydrates and proteins. we find that 1gm of fat equal 9 kcal and 1 gm of protein and carbohydrate equal 4 kcal.\u003c/h4>\u003c/div>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"80\">\u003cspan class=\"archive-cell-label\" dir=\"ltr\">Cell 80 / 99 · markdown\u003c/span>\u003cdiv class=\"archive-text\" lang=\"en\" dir=\"ltr\">\u003ch4>for example as first row of dataframe NoZeroCal we predict the calories of first row as 300 \u003c/h4>\n\u003ch4>we find around 7 calories as a difference \u003c/h4>\u003c/div>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"81\">\u003cspan class=\"archive-cell-label\" dir=\"ltr\">Cell 81 / 99 · markdown\u003c/span>\u003cdiv class=\"archive-text\" lang=\"en\" dir=\"ltr\">\u003ch4>to see what could be the hidden sources of calories in food\u003c/h4>\u003c/div>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"82\">\u003cspan class=\"archive-cell-label\" dir=\"ltr\">Cell 82 / 99 · markdown\u003c/span>\u003cdiv class=\"archive-text\" lang=\"en\" dir=\"ltr\">\u003ch4>fit model to discover the hidden sources of calories\u003c/h4>\u003c/div>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"83\">\u003cspan class=\"archive-cell-label\" dir=\"ltr\">Cell 83 / 99 · markdown\u003c/span>\u003cdiv class=\"archive-text\" lang=\"en\" dir=\"ltr\">\u003ch4>may be from fiber or alcohol. so we use df_food_Nna to drop any missing data. So we fit another model to predict if alcohol and fiber produce calories.\u003c/h4>\u003c/div>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"84\">\u003cdetails class=\"study-details\">\u003csummary>Cell 84 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>df_food_Nna_no = DataframeAddCol(df_food_Nna,dictcol)\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"85\">\u003cdetails class=\"study-details\">\u003csummary>Cell 85 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>NoZeroCalNna = df_food_Nna_no[df_food_Nna_no[&#x27;Calories_kcal&#x27;] != 0.0]\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"86\">\u003cdetails class=\"study-details\">\u003csummary>Cell 86 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>NoZeroCalNna.info()\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"87\">\u003cdetails class=\"study-details\">\u003csummary>Cell 87 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>mdl_calories_vs_All = ols(&#x27;Calories_kcal ~ Protein_g + Fat_g + Carbohydrate_g + Alcohol_g + Fiber_g + Category + Category : Protein_g + Category:Fat_g + Category : Carbohydrate_g + Category : Alcohol_g + Category : Fiber_g + 0&#x27;, data=NoZeroCal).fit()\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"88\">\u003cdetails class=\"study-details\">\u003csummary>Cell 88 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>CatList = list(NoZeroCalNna[&#x27;Category&#x27;].unique())\nAlcList = np.arange(0,50,10)\nFibList = np.arange(0,50,10)\nproteinList = np.arange(0,50,10)\nfatList = np.arange(0,50,10)\ncarbohydrateList = np.arange(0,50,10)\n\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"89\">\u003cdetails class=\"study-details\">\u003csummary>Cell 89 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>p1 = product(CatList, AlcList, FibList, proteinList, fatList, carbohydrateList )\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"90\">\u003cdetails class=\"study-details\">\u003csummary>Cell 90 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>\nexplanatoryDataAll = pd.DataFrame(p1,\n    columns=[&quot;Category&quot;,\n&quot;Alcohol_g&quot;,\n&quot;Fiber_g&quot;,\n            &quot;Protein_g&quot;,\n            &quot;Fat_g&quot;,\n            &quot;Carbohydrate_g&quot;])\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"91\">\u003cdetails class=\"study-details\">\u003csummary>Cell 91 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>mse2 = mdl_calories_vs_All.mse_resid\nrse2 = np.sqrt(mse2)\nprint(mdl_calories_vs_All.rsquared_adj)\nprint(mdl_calories_vs_All.rsquared)\nprint(&quot;MSE:&quot;,mse2)\nprint(&quot;RSE:&quot;,rse2)\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"92\">\u003cdetails class=\"study-details\">\u003csummary>Cell 92 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>predictionDataAll = explanatoryDataAll.assign(\n    Calories_kcal = mdl_calories_vs_All.predict(explanatoryDataAll)\n)\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"93\">\u003cdetails class=\"study-details\">\u003csummary>Cell 93 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>predictionDataAll\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"94\">\u003cdetails class=\"study-details\">\u003csummary>Cell 94 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>\ndef dfonecolvalue(df, col1, val1, val2,li):\n    &quot;&quot;&quot;\n    make one column with val1 and selected column of df in li list set their values to val2.\n    df: dataframe of choice.\n    col1: column that you want to set to the selected value.\n    val1: value you want to select from col1.\n    val2: value you want to select from all columns of the dataframe.\n    li list of columns that set values to val2\n    \n\n    Returns a new dataframe named as df + col1 + val1.\n    &quot;&quot;&quot;\n    new_df = df.copy()  # Create a copy of the original dataframe\n    new_df = new_df[new_df[col1]==val1]\n    for i in li:\n        new_df = new_df[new_df[i]==val2]\n        \n    return new_df\n   \n\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"95\">\u003cdetails class=\"study-details\">\u003csummary>Cell 95 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>\nlistAlc = [&quot;Fiber_g&quot;,&quot;Protein_g&quot;,&quot;Fat_g&quot;,&quot;Carbohydrate_g&quot;]\nlistFiber = [&quot;Alcohol_g&quot;,&quot;Protein_g&quot;,&quot;Fat_g&quot;,&quot;Carbohydrate_g&quot;]\n \n   \ndf_10_Alc_predict = dfonecolvalue(predictionDataAll,&quot;Alcohol_g&quot;,10,0,listAlc)\ndf_10_Fib_predict = dfonecolvalue(predictionDataAll,&quot;Fiber_g&quot;,10,0,listFiber)\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"96\">\u003cdetails class=\"study-details\">\u003csummary>Cell 96 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>\ndf_10_Alc_predict[&quot;Calories_kcal&quot;].mean()\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"97\">\u003cdetails class=\"study-details\">\u003csummary>Cell 97 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>df_10_Fib_predict[&quot;Calories_kcal&quot;].mean()\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"98\">\u003cspan class=\"archive-cell-label\" dir=\"ltr\">Cell 98 / 99 · markdown\u003c/span>\u003cdiv class=\"archive-text\" lang=\"en\" dir=\"ltr\">\u003ch4>last we see that alcohol can give us around 7 kcal, t  { padding:1rem; }\n  .food-study pre { padding:1rem; font-size:.75rem; }\n  .food-study .study-contents a { font-size:.8rem; }\n}\n@media(prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } }\n\u003c/style>\u003c/head>\u003cbody class=\"food-study\">\u003ca class=\"skip-link\" href=\"#main\">انتقل إلى المحتوى\u003c/a>\u003cheader class=\"site-header\">\u003ca class=\"brand\" href=\"index-ar.html\">\u003cimg class=\"brand-symbol\" src=\"assets/brand/shams-insights-mark.svg\" width=\"40\" height=\"40\" alt=\"\" aria-hidden=\"true\" decoding=\"async\">\u003cspan class=\"brand-text\">\u003cspan class=\"brand-name\">شمس إنسايتس\u003c/span>\u003csmall>شمس الدين إسماعيل\u003c/small>\u003c/span>\u003c/a>\u003ca class=\"language-switch\" href=\"nutrition.html\" lang=\"en\" hreflang=\"en\" aria-label=\"الانتقال إلى الإنجليزية — English\" data-language-switch=\"\" dir=\"ltr\">\u003csvg viewbox=\"0 0 24 24\" width=\"18\" height=\"18\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\">\u003c/circle>\u003cellipse cx=\"12\" cy=\"12\" rx=\"4\" ry=\"9\">\u003c/ellipse>\u003cpath d=\"M3 12h18\">\u003c/path>\u003c/svg>\u003cspan>English\u003c/span>\u003c/a>\u003cbutton class=\"menu-button\" id=\"menuButton\" aria-controls=\"navigation\" aria-label=\"فتح القائمة\" aria-expanded=\"false\">\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003c/button>\u003cnav id=\"navigation\" aria-label=\"القائمة الرئيسية\">\u003ca href=\"index-ar.html#projects\">المشروعات\u003c/a>\u003ca href=\"learning-ar.html\">التعلّم\u003c/a>\u003ca href=\"nutrition-ar.html\">دراسة الأغذية\u003c/a>\u003ca class=\"nav-cta\" href=\"assets/Shamseldeen_Ismaiil_Data_Analyst_CV_AR.pdf\">تنزيل السيرة الذاتية\u003c/a>\u003c/nav>\u003c/header>\u003cmain id=\"main\">\u003csection class=\"learning-hero\">\u003cp class=\"eyebrow\">دراسة باستخدام Python · العمل الأصلي ديسمبر 2023\u003c/p>\u003ch1>تركيب الأغذية.\u003cbr>\u003cem>الدليل قبل الاستنتاج.\u003c/em>\u003c/h1>\u003cp class=\"lead\">استخدمت pandas والتصور البياني والانحدار لدراسة العلاقة بين العناصر الغذائية والطاقة في بيانات مشتقة من USDA. وتوضح المراجعة اللاحقة افتراضات هذا التحليل وحدوده.\u003c/p>\u003cdiv class=\"learning-stats\">\u003cdiv>\u003cstrong>7,793\u003c/strong>\u003cspan>سجلًا غذائيًا\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>25\u003c/strong>\u003cspan>فئة غذائية\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>3\u003c/strong>\u003cspan>صيغ للانحدار الخطي OLS\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>100 غرام\u003c/strong>\u003cspan>أساس موحد للمقارنة\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"hero-actions\">\u003ca class=\"button button-primary\" href=\"nutrition-analysis-ar.html\">اقرأ التحليل الكامل داخل الموقع\u003c/a>\u003ca class=\"button button-secondary\" href=\"https://www.datacamp.com/datalab/w/fdca12cd-5848-4e96-a15c-501ce409e1ad\" target=\"_blank\" rel=\"noopener\">المنشور الأصلي في 2023 ↗\u003c/a>\u003c/div>\u003cdiv class=\"quick-links\">\u003cspan class=\"access-badge\">متاح للجميع دون تسجيل\u003c/span>\u003ca href=\"learning/nutrition/original_2023_reviewed.ipynb\" download>تنزيل دفتر 2023 المؤرشف\u003c/a>\u003ca href=\"learning/nutrition/reviewed_analysis.py\" download>تنزيل كود المراجعة\u003c/a>\u003c/div>\u003c/section>\n\u003csection class=\"learning-section\" id=\"findings\">\u003cdiv class=\"section-label\">النتائج في دقيقة\u003c/div>\u003ch2>ثلاث نتائج، ثم التفاصيل لمن يريد.\u003c/h2>\u003cdiv class=\"food-findings\">\u003carticle class=\"food-finding\">\u003cstrong>−0.895\u003c/strong>\u003ch3>ارتباط الماء والسعرات\u003c/h3>\u003cp>ترتبط نسبة الماء الأعلى بكثافة طاقة أقل لكل 100 غرام ضمن هذه البيانات.\u003c/p>\u003c/article>\u003carticle class=\"food-finding\">\u003cstrong>30.7%\u003c/strong>\u003ch3>سجلات بلا قيمة للكحول\u003c/h3>\u003cp>البيانات غير المسجلة تظل مفقودة؛ لا نفترض أنها صفر.\u003c/p>\u003c/article>\u003carticle class=\"food-finding\">\u003cstrong>13.55\u003c/strong>\u003ch3>خطأ RMSE في الاختبار\u003c/h3>\u003cp>كيلو سعر حراري لكل 100 غرام للنموذج الموسّع، مع توضيح حدود المقارنة.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\n\u003csection class=\"learning-section narrow\">\u003cdiv class=\"section-label\">سؤال التحليل\u003c/div>\u003ch2>ما الذي يفسر كثافة الطاقة؟\u003c/h2>\u003cp>بدأ التحليل ضمن مسابقة تعلّم على DataCamp: استكشاف تركيب الأغذية، وتحديد مصادر فيتامين C، ودراسة العلاقة بين الماء والسعرات، وبناء نماذج خطية للطاقة. وسّعت النموذج الأساسي بإضافة الفئات الغذائية والتفاعلات والكحول والألياف.\u003c/p>\u003cp>تتضمن البيانات تسعة حقول للعناصر الغذائية والطاقة، إلى جانب معرّفات الأغذية وأوصافها وفئاتها. تُقاس القيم لكل 100 غرام لتكون المقارنة على أساس كتلة موحدة.\u003c/p>\u003cp class=\"caption\">المصدر: مجموعة DataCamp بعنوان «What Foods Are the Most Nutritious?»، المعدّلة من \u003ca href=\"https://fdc.nal.usda.gov/download-datasets.html\" target=\"_blank\" rel=\"noopener\">USDA FoodData Central\u003c/a>. يعود نشر تحليلي إلى 11 ديسمبر 2023. كانت مسابقة تعليمية دون تحكيم؛ المشاركة لا تعني الحصول على جائزة.\u003c/p>\u003c/section>\n\u003csection class=\"learning-section\">\u003cdiv class=\"study-feature\">\u003cdiv>\u003cdiv class=\"section-label\">من النص إلى التحليل\u003c/div>\u003ch2>تجهيز البيانات\u003c/h2>\u003cp>حوّلت نصوصًا مثل «5.88 g» و«307.0 kcal» إلى قيم رقمية، وفحصت القيم المفقودة، ولخصت الفئات الغذائية، ورسمت العلاقات بين العناصر الغذائية.\u003c/p>\u003cp>تحافظ المراجعة على القيم المفقودة حتى تحدد كل خطوة تحليلية كيفية التعامل معها. قيمة الكحول مفقودة في 2,394 سجلًا؛ تعويضها بصفر مباشرة يضيف افتراضًا غير مثبت.\u003c/p>\u003cp>\u003cstrong>ارتباط ملاحظ:\u003c/strong> معامل ارتباط بيرسون بين الماء والسعرات يساوي −0.895 في هذه البيانات. ترتبط نسبة الماء الأعلى عمومًا بكثافة طاقة أقل لكل 100 غرام.\u003c/p>\u003c/div>\u003cfigure>\u003cimg src=\"learning/nutrition/results/water-calories.png\" alt=\"الماء والسعرات في 7,793 سجلًا غذائيًا؛ معامل ارتباط بيرسون سالب 0.895\" width=\"1600\" height=\"928\">\u003cfigcaption>علاقة وصفية بين الأغذية، ولا تقيس نتائج صحية.\u003c/figcaption>\u003c/figure>\u003c/div>\u003c/section>\n\u003csection class=\"learning-section narrow\">\u003cdiv class=\"section-label\">النموذج الأصلي\u003c/div>\u003ch2>بداية واضحة وقابلة للفحص\u003c/h2>\u003cp>استخدمت الصيغة الأولى البروتين والدهون والكربوهيدرات لتفسير السعرات، دون ثابت انحدار. أعادت المراجعة إنتاج المعاملات المحفوظة: \u003cstrong>4.137\u003c/strong> للبروتين، و \u003cstrong>8.844\u003c/strong> للدهون، و \u003cstrong>3.854\u003c/strong> للكربوهيدرات، بوحدة كيلو سعر حراري لكل غرام.\u003c/p>\u003cp>أضاف الدفتر الأصلي تأثيرات الفئات وتفاعلاتها، ثم الكحول والألياف. كانت الأخطاء المعيارية المتبقية المحفوظة 16.68 و13.89 و8.14 كيلو سعر حراري. تصف هذه الأرقام ملاءمة بيانات التدريب، ولا تقيس التنبؤ بأغذية جديدة.\u003c/p>\u003c/section>\n\u003csection class=\"learning-section\">\u003cdiv class=\"section-label\">مراجعة قابلة لإعادة التشغيل · سبتمبر 2026\u003c/div>\u003ch2>مقارنة على بيانات اختبار منفصلة\u003c/h2>\u003cp class=\"section-intro\">تستخدم المراجعة الصفوف نفسها لكل النماذج: 5,334 سجلًا بسعرات موجبة ومدخلات نموذج مكتملة. ينتج التقسيم الثابت داخل كل فئة 4,278 صفًا للتدريب و1,056 للاختبار. لا يُستبعد الصف بسبب نقص الكوليسترول أو فيتامين C لأنهما ليسا من مدخلات النماذج.\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">صيغة النموذج\u003c/th>\u003cth scope=\"col\">متوسط الخطأ المطلق MAE\u003c/th>\u003cth scope=\"col\">جذر متوسط مربع الخطأ RMSE\u003c/th>\u003cth scope=\"col\">الرتبة / عدد الأعمدة\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>العناصر الغذائية الكبرى\u003c/td>\u003ctd>6.86\u003c/td>\u003ctd>15.38\u003c/td>\u003ctd>3 / 3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>تفاعلات الفئات\u003c/td>\u003ctd>6.04\u003c/td>\u003ctd>15.71\u003c/td>\u003ctd>100 / 100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>تفاعلات الكحول والألياف\u003c/td>\u003ctd>4.70\u003c/td>\u003ctd>13.55\u003c/td>\u003ctd>126 / 150\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"caption\">تقاس قيم MAE وRMSE بكيلو سعر حراري لكل 100 غرام. هذه نتائج مراجعة 2026، وليست نتائج التقديم الأصلي.\u003c/p>\u003cp>تزيد إضافة تفاعلات الفئات وحدها RMSE قليلًا في هذا التقسيم. تخفض إضافة الكحول والألياف القيمة إلى 13.55، لكن مصفوفة التفاعلات الكاملة ناقصة الرتبة: 126 من أصل 150 عمودًا. لذلك يتطلب تفسير المعاملات الفردية الحذر.\u003c/p>\u003cp>\u003ca class=\"text-link\" href=\"learning/nutrition/results/model_comparison.csv\">تنزيل مقارنة النماذج بصيغة CSV\u003c/a>\u003c/p>\u003c/section>\n\u003csection class=\"learning-section narrow\">\u003cdiv class=\"section-label\">ما تعلمته\u003c/div>\u003ch2>جودة الملاءمة تحتاج إلى سياق\u003c/h2>\u003cul class=\"review-points\">\u003cli>\u003cstrong>احتفظ بمعنى القيم المفقودة.\u003c/strong> «غير مذكور» لا يعني صفرًا.\u003c/li>\u003cli>\u003cstrong>افحص البيانات المستخدمة فعليًا في النموذج.\u003c/strong> وصف الدفتر الأصلي نموذجًا يعتمد على الحالات المكتملة، لكنه استخدم إطار بيانات سبق تعويض القيم المفقودة فيه بصفر. توضح المراجعة اختيار الصفوف صراحة.\u003c/li>\u003cli>\u003cstrong>تجنب سيناريوهات غير ممكنة.\u003c/strong> احتوت شبكة التنبؤ الأصلية على تركيبات لا تناسب عينة غذائية بوزن 100 غرام. تقيّم المراجعة صفوف أغذية موجودة فعلًا في البيانات.\u003c/li>\u003cli>\u003cstrong>افصل الوصف عن السببية.\u003c/strong> لا يثبت تركيب الغذاء خطر الإصابة بمرض أو الأثر السريري لنظام غذائي.\u003c/li>\u003c/ul>\u003cp>المقارنة على بيانات الاختبار تحقق داخلي من قابلية إعادة التشغيل. قد تظهر منتجات متشابهة في التدريب والاختبار، وقد يؤدي اختيار الحالات المكتملة إلى تحيز. هذا عمل تعلّم استكشافي، ولا يمثل نظامًا سريريًا أو إنتاجيًا للتنبؤ.\u003c/p>\u003cdiv class=\"hero-actions\">\u003ca class=\"button button-primary\" href=\"nutrition-analysis-ar.html#code\">اقرأ المنهجية والكود كاملًا\u003c/a>\u003ca class=\"button button-secondary\" href=\"learning-ar.html\">العودة إلى سجل التعلّم\u003c/a>\u003c/div>\u003c/section>\u003c/main>\u003cfooter>\u003cspan>شمس الدين إسماعيل · خبرة صيدلانية. رؤية تحليلية واضحة.\u003c/span>\u003ca href=\"mailto:shams@shamsinsights.com\" dir=\"ltr\">shams@shamsinsights.com\u003c/a>\u003c/footer>\u003cscript src=\"script.js?v=arabic3\">\u003c/script>\u003cscript src=\"learning.js?v=arabic3\">\u003c/script>\u003cscript src=\"locale.js?v=arabic3\" defer>\u003c/script>\u003c/body>\u003c/html>\n", "saudi-pharma-ar.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ar\" dir=\"rtl\">\u003chead>\u003cbase href=\"https://shamsinsights.com/\">\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>ذكاء الأعمال لتوزيع الأدوية | شمس إنسايتس\u003c/title>\n\u003cmeta name=\"description\" content=\"ذكاء الأعمال لتوزيع الأدوية | شمس إنسايتس — شرح موثق للمشروعات والمهارات والنتائج وروابط التحقق.\">\n\u003cmeta name=\"theme-color\" content=\"#0b2f26\">\u003cmeta property=\"og:type\" content=\"article\">\u003cmeta property=\"og:title\" content=\"ذكاء الأعمال لتوزيع الأدوية | شمس إنسايتس\">\n\u003cmeta property=\"og:description\" content=\"ذكاء الأعمال لتوزيع الأدوية | شمس إنسايتس — شرح موثق للمشروعات والمهارات والنتائج وروابط التحقق.\">\n\u003cmeta property=\"og:url\" content=\"https://shamsinsights.com/saudi-pharma-ar.html\">\u003cmeta property=\"og:image\" content=\"https://shamsinsights.com/p00-executive-overview.jpg\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Newsreader:ital,wght@0,600;1,600&amp;display=swap\" rel=\"stylesheet\">\n\u003cstyle>:root{--ink:#10231e;--forest:#0b2f26;--green:#176b52;--mint:#dff3e9;--cream:#f6f3eb;--paper:#fffdf7;--orange:#e36f39;--line:#d7ddd7;--muted:#60706a;--shadow:0 24px 70px rgba(11,47,38,.12)}\n*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:\"DM t-size: 20px; }\n  .site-header .brand-text small { font-size: 10px; }\n  .brand-symbol { width: 32px; height: 32px; }\n}\n\n@media (max-width: 360px) {\n  .site-header .brand { gap: 7px; }\n  .site-header .brand-name { font-size: 18px; }\n  .brand-symbol { width: 30px; height: 30px; }\n  .site-header > .language-switch svg { display: none; }\n}\n\u003c/style>\n\u003clink rel=\"icon\" type=\"image/svg+xml\" href=\"assets/brand/favicon.svg\">\n\u003c/head>\u003cbody class=\"case-study\">\n\u003ca class=\"skip-link\" href=\"#main\">انتقل إلى المحتوى\u003c/a>\n\u003cheader class=\"site-header\">\u003ca class=\"brand\" href=\"index-ar.html\">\u003cimg class=\"brand-symbol\" src=\"assets/brand/shams-insights-mark.svg\" width=\"40\" height=\"40\" alt=\"\" aria-hidden=\"true\" decoding=\"async\">\u003cspan class=\"brand-text\">\u003cspan class=\"brand-name\">شمس إنسايتس\u003c/span>\u003csmall>شمس الدين إسماعيل\u003c/small>\u003c/span>\u003c/a>\u003ca class=\"language-switch\" href=\"saudi-pharma.html\" lang=\"en\" hreflang=\"en\" aria-label=\"الانتقال إلى الإنجليزية — English\" data-language-switch=\"\" dir=\"ltr\">\u003csvg viewbox=\"0 0 24 24\" width=\"18\" height=\"18\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\">\u003c/circle>\u003cellipse cx=\"12\" cy=\"12\" rx=\"4\" ry=\"9\">\u003c/ellipse>\u003cpath d=\"M3 12h18\">\u003c/path>\u003c/svg>\u003cspan>English\u003c/span>\u003c/a>\u003cbutton class=\"menu-button\" id=\"menuButton\" aria-controls=\"navigation\" aria-label=\"فتح القائمة\" aria-expanded=\"false\">\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003c/button>\u003cnav id=\"navigation\" aria-label=\"القائمة الرئيسية\">\u003ca href=\"index-ar.html#about\">نبذة\u003c/a>\u003ca href=\"index-ar.html#projects\">المشروعات\u003c/a>\u003ca href=\"#user-guide\">دليل الاستخدام\u003c/a>\u003ca class=\"nav-cta\" href=\"mailto:shams@shamsinsights.com\" dir=\"ltr\">تواصل\u003c/a>\u003c/nav>\u003c/header>\n\u003cmain id=\"main\">\n\u003csection class=\"case-hero\">\u003ca class=\"breadcrumb\" href=\"index-ar.html#projects\">← البورتفوليو / مشروعات مختارة\u003c/a>\u003cdiv class=\"case-hero-grid\">\u003cdiv>\u003cp class=\"eyebrow\">\u003cspan class=\"live-dot\">\u003c/span> المشروع الرئيسي · Power BI · تقرير تفاعلي\u003c/p>\u003ch1>تحليلات الأدوية\u003cbr>\u003cem>والأداء التجاري.\u003c/em>\u003c/h1>\u003cp class=\"case-intro\">رؤية مترابطة للمبيعات والربحية والعملاء والمستهدفات ومخاطر المخزون لموزّع أدوية افتراضي في السعودية.\u003c/p>\u003cdiv class=\"hero-actions\">\u003ca class=\"button button-primary\" href=\"#dashboard\">استكشف التقرير التفاعلي ↓\u003c/a>\u003ca class=\"button button-secondary\" href=\"#user-guide\">ابدأ الجولة الإرشادية\u003c/a>\u003c/div>\u003c/div>\u003caside class=\"project-brief\">\u003cspan class=\"eyebrow\">بطاقة المشروع\u003c/span>\u003cdl>\u003cdiv>\u003cdt>إعداد\u003c/dt>\u003cdd>شمس الدين إسماعيل\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>المجال\u003c/dt>\u003cdd>تحليلات الأداء التجاري والمخزون\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>الأدوات\u003c/dt>\u003cdd>Power BI · Power Query · DAX\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>البيانات\u003c/dt>\u003cdd>بيانات تدريب اصطناعية · ريال سعودي\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>الفترة\u003c/dt>\u003cdd>1 سبتمبر 2023 – 31 أغسطس 2026\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>المخرجات\u003c/dt>\u003cdd>تقرير من 6 صفحات ودراسة حالة موثقة\u003c/dd>\u003c/div>\u003c/dl>\u003c/aside>\u003c/div>\n\u003cdiv class=\"scope-stats\">\u003cdiv>\u003cstrong>150,000\u003c/strong>\u003cspan>سطر مبيعات\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>48,613\u003c/strong>\u003cspan>فاتورة فريدة\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>70\u003c/strong>\u003cspan>مقياسًا وتعريفًا مساعدًا بلغة DAX\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>6\u003c/strong>\u003cspan>صفحات لتحليل قرارات الأعمال\u003c/span>\u003c/div>\u003c/div>\u003c/section>\n\u003cnav class=\"case-nav\" aria-label=\"أقسام دراسة الحالة\">\u003ca href=\"#overview\">سياق الأعمال\u003c/a>\u003ca href=\"#dashboard\">التقرير التفاعلي\u003c/a>\u003ca href=\"#pages\">جولة الصفحات الست\u003c/a>\u003ca href=\"#user-guide\">طريقة الاستخدام\u003c/a>\u003ca href=\"#model\">البيانات والنموذج\u003c/a>\u003ca href=\"#metrics\">قاموس المقاييس\u003c/a>\u003ca href=\"#findings\">النتائج\u003c/a>\u003ca href=\"#validation\">التحقق والنطاق\u003c/a>\u003c/nav>\n\u003csection class=\"case-section\" id=\"overview\">\u003cdiv class=\"section-label\">01 / سياق الأعمال\u003c/div>\u003cdiv class=\"section-heading\">\u003ch2>من إجمالي المبيعات\u003cbr>إلى سؤال أدق.\u003c/h2>\u003cp>صُمّم المشروع حول الأسئلة التي يحتاج المدير التجاري أو مسؤول المبيعات أو محلل المخزون إلى فحصها.\u003c/p>\u003c/div>\n\u003cdiv class=\"question-grid\">\u003carticle>\u003cspan class=\"small-index\">01\u003c/span>\u003ch3>الأداء التجاري\u003c/h3>\u003cp>هل تواكب المبيعات المستهدفات؟ وما المنتجات والعملاء والقنوات التي تسهم في الإيراد والهامش؟\u003c/p>\u003c/article>\u003carticle>\u003cspan class=\"small-index\">02\u003c/span>\u003ch3>تنفيذ المبيعات\u003c/h3>\u003cp>أي المندوبين والمناطق يحتاج إلى متابعة؟ وكيف تغيّر الخصومات والمرتجعات وتركيبة العملاء تفسير المبيعات؟\u003c/p>\u003c/article>\u003carticle>\u003cspan class=\"small-index\">03\u003c/span>\u003ch3>قرارات المخزون\u003c/h3>\u003cp>أين يتركز نفاد المخزون وفجوات إعادة الطلب والأصناف القريبة من انتهاء الصلاحية؟ وما أولويات المراجعة؟\u003c/p>\u003c/article>\u003c/div>\n\u003cdiv class=\"editorial-note\">\u003cstrong>مساهمتي في المشروع\u003c/strong>\u003cp>استخدمت خبرتي في عمليات الصيدليات لصياغة أسئلة الأعمال، وجهزت جداول المصادر ودمجتها في Power Query، ونظمت نموذج البيانات، وبنيت مقاييس DAX وصفحات التقرير الست، ثم نشرت النتيجة مع توثيقها. يهدف العمل إلى تقديم طريقة أوضح للتحليل؛ ولا يدّعي تحقيق أثر تجاري مقاس في شركة فعلية.\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"case-section report-section\" id=\"dashboard\">\u003cdiv class=\"section-heading\">\u003cdiv>\u003cdiv class=\"section-label\">02 / التقرير التفاعلي\u003c/div>\u003ch2>استكشف القرارات\u003cbr>وراء الأرقام.\u003c/h2>\u003c/div>\u003cp>ابدأ بالنظرة العامة، ثم تنقل بين الصفحات من القائمة اليسرى داخل التقرير. هذا العرض العام لا يحتاج إلى حساب Power BI. واجهة التقرير الأصلية بالإنجليزية، والشرح الكامل بالعربية أدناه.\u003c/p>\u003c/div>\n\u003cdiv class=\"viewer-toolbar\">\u003cspan>\u003cspan class=\"live-dot\">\u003c/span> تقرير Power BI منشور \u003csmall>· بيانات اصطناعية\u003c/small>\u003c/span>\u003cdiv>\u003cbutton class=\"text-button\" id=\"resetReport\" type=\"button\" disabled>إعادة ضبط التقرير\u003c/button>\u003ca class=\"text-link\" href=\"https://app.powerbi.com/view?r=eyJrIjoiYmM0NGQ0MmUtZmJlMi00YWZhLTk5MGMtZTA5YzU3OTdiNGZhIiwidCI6ImUyNTlmZjI5LTQyOTgtNDcyNC1hNGYxLWUwNjJhN2ViY2FiNyJ9&amp;pageName=b666e32ee00e3b344f02\" target=\"_blank\" rel=\"noopener\">فتح التقرير كاملًا ↗\u003c/a>\u003c/div>\u003c/div>\n\u003cdiv class=\"report-shell\" id=\"reportShell\" data-report-url=\"https://app.powerbi.com/view?r=eyJrIjoiYmM0NGQ0MmUtZmJlMi00YWZhLTk5MGMtZTA5YzU3OTdiNGZhIiwidCI6ImUyNTlmZjI5LTQyOTgtNDcyNC1hNGYxLWUwNjJhN2ViY2FiNyJ9&amp;pageName=b666e32ee00e3b344f02\">\u003cdiv class=\"report-placeholder\" id=\"reportPlaceholder\">\u003cimg src=\"p00-executive-overview.jpg\" alt=\"معاينة النظرة التنفيذية؛ اضغط تحميل التقرير التفاعلي لاستكشاف لوحة البيانات\" width=\"1363\" height=\"938\" loading=\"lazy\">\u003cdiv class=\"report-start\">\u003cbutton type=\"button\" class=\"button button-primary\" id=\"loadReport\">تحميل التقرير التفاعلي \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/button>\u003cspan>يُحمّل التقرير عندما تختار استكشافه.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n\u003cp class=\"report-status\" id=\"reportStatus\" role=\"status\" aria-live=\"polite\">هذه معاينة. حمّل التقرير لاستخدام الفلاتر والتنقل بين صفحاته.\u003c/p>\u003cnoscript>\u003cp>JavaScript غير مفعّل. \u003ca class=\"text-link\" href=\"https://app.powerbi.com/view?r=eyJrIjoiYmM0NGQ0MmUtZmJlMi00YWZhLTk5MGMtZTA5YzU3OTdiNGZhIiwidCI6ImUyNTlmZjI5LTQyOTgtNDcyNC1hNGYxLWUwNjJhN2ViY2FiNyJ9&amp;pageName=b666e32ee00e3b344f02\" target=\"_blank\" rel=\"noopener\">فتح التقرير التفاعلي في Power BI ↗\u003c/a>\u003c/p>\u003c/noscript>\n\u003cp class=\"viewer-help\">على الهاتف، يمنح الوضع الأفقي أو خيار \u003cstrong>فتح التقرير كاملًا\u003c/strong> مساحة أكبر للرسوم. إذا ظل الإطار فارغًا، استخدم الرابط المباشر أعلاه. \u003ca href=\"#user-guide\">اقرأ دليل الاستخدام ↓\u003c/a>\u003c/p>\n\u003cdetails class=\"inline-details\">\u003csummary>قبل مقارنة المستهدفات أو مخاطر الصلاحية\u003c/summary>\u003cp>عند تحليل تحقيق المستهدف، اترك فلتر منطقة العميل \u003cstrong>المنطقة (Region)\u003c/strong> على \u003cstrong>الكل (All)\u003c/strong>. ترتبط المستهدفات بالشهر ومندوب المبيعات؛ فلتر منطقة العميل لا يخفض المستهدف في هذه النسخة. المخزون لقطة في تاريخ محدد، والتعرض لانتهاء الصلاحية مؤشر فحص يعتمد على أقرب تاريخ صلاحية.\u003c/p>\u003c/details>\u003c/section>\n\u003csection class=\"case-section\" id=\"pages\">\u003cdiv class=\"section-label\">03 / جولة الصفحات الست\u003c/div>\u003cdiv class=\"section-heading\">\u003ch2>مشروع واحد.\u003cbr>ست زوايا للتحليل.\u003c/h2>\u003cp>افتح كل صفحة أدناه للاطلاع على صورتها الفعلية، والسؤال الذي تجيب عنه، والفلاتر المتاحة، ومثال للاستكشاف.\u003c/p>\u003c/div>\u003cdiv class=\"page-tour\">\u003cdetails class=\"page-detail\" id=\"page-01\">\u003csummary>\u003cspan class=\"page-number\">01\u003c/span>\u003cspan>\u003cstrong>النظرة العامة · Executive Overview\u003c/strong>\u003csmall>كيف يبدو الأداء العام للأعمال؟\u003c/small>\u003c/span>\u003cspan class=\"detail-symbol\" aria-hidden=\"true\">+\u003c/span>\u003c/summary>\n    \u003cdiv class=\"page-detail-body\">\u003ca class=\"screenshot-link\" href=\"p00-executive-overview.jpg\" target=\"_blank\" rel=\"noopener\" aria-label=\"افتح صورة مكبّرة لصفحة نظرة تنفيذية شاملة\">\u003cimg src=\"p00-executive-overview.jpg\" width=\"1363\" height=\"938\" loading=\"lazy\" alt=\"صفحة نظرة تنفيذية شاملة من تقرير التحليلات التجارية لقطاع الأدوية السعودي\">\u003c/a>\n    \u003cdiv class=\"page-explanation\">\u003cp class=\"eyebrow\">الفترة · منطقة العميل\u003c/p>\u003ch3>ماذا تعرض هذه الصفحة؟\u003c/h3>\u003cp>ابدأ بصافي المبيعات ومجمل الربح والهامش وتحقيق المستهدف ومعدل المرتجعات بالوحدات. تساعد الاتجاهات الشهرية ومساهمة المناطق والفئات وحسابات العملاء على تحديد مواضع البحث التالية.\u003c/p>\u003ch3>جرّب بنفسك\u003c/h3>\u003cp>اقرأ خط الأساس الكلي، ثم قارن المبيعات والهامش بين مناطق العملاء. عند مقارنة المستهدف، اترك Region على All، واستخدم صفحة Agents &amp; Targets لتحليل المندوبين.\u003c/p>\u003cp class=\"context-note\">\u003cstrong>انتبه إلى السياق.\u003c/strong> مستوى تفصيل المستهدف هو شهر × مندوب مبيعات. لا يخفض فلتر منطقة العميل مقام نسبة تحقيق المستهدف في هذه النسخة.\u003c/p>\u003ca class=\"text-link\" href=\"#dashboard\">جرّب في التقرير التفاعلي ↑\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"page-detail\" id=\"page-02\">\u003csummary>\u003cspan class=\"page-number\">02\u003c/span>\u003cspan>\u003cstrong>أداء المبيعات · Sales Performance\u003c/strong>\u003csmall>ما الذي يفصل الإيراد الإجمالي عن المبيعات المربحة؟\u003c/small>\u003c/span>\u003cspan class=\"detail-symbol\" aria-hidden=\"true\">+\u003c/span>\u003c/summary>\n    \u003cdiv class=\"page-detail-body\">\u003ca class=\"screenshot-link\" href=\"p00-sales-performance.jpg\" target=\"_blank\" rel=\"noopener\" aria-label=\"افتح صورة مكبّرة لصفحة أداء المبيعات\">\u003cimg src=\"p00-sales-performance.jpg\" width=\"1363\" height=\"938\" loading=\"lazy\" alt=\"صفحة أداء المبيعات من تقرير التحليلات التجارية لقطاع الأدوية السعودي\">\u003c/a>\n    \u003cdiv class=\"page-explanation\">\u003cp class=\"eyebrow\">الفترة · منطقة العميل · نوع الطلب\u003c/p>\u003ch3>ماذا تعرض هذه الصفحة؟\u003c/h3>\u003cp>تتبّع الانتقال من المبيعات الإجمالية إلى الصافية عبر الخصومات والمرتجعات، وقارن المبيعات الشهرية بالهامش، واستكشف القنوات والعروض ووسائل الدفع. يضيف عدد الفواتير ومتوسط قيمة الطلب سياقًا للمعاملات.\u003c/p>\u003ch3>جرّب بنفسك\u003c/h3>\u003cp>اختر نوع طلب أو قناة، وافحص الهامش إلى جانب الإيراد، ومرّر المؤشر لقراءة المقاييس المساندة. استخدم رسم الانتقال لتفسير الفرق بين المبيعات الإجمالية والصافية.\u003c/p>\u003cp class=\"context-note\">\u003cstrong>انتبه إلى السياق.\u003c/strong> صافي المبيعات يستبعد ضريبة القيمة المضافة. مقارنة العروض وصفية، ولا تثبت أثر العرض الإضافي في المبيعات.\u003c/p>\u003ca class=\"text-link\" href=\"#dashboard\">جرّب في التقرير التفاعلي ↑\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"page-detail\" id=\"page-03\">\u003csummary>\u003cspan class=\"page-number\">03\u003c/span>\u003cspan>\u003cstrong>المنتجات والفئات · Products &amp; Categories\u003c/strong>\u003csmall>أي المنتجات يسهم في الإيراد والحجم والهامش؟\u003c/small>\u003c/span>\u003cspan class=\"detail-symbol\" aria-hidden=\"true\">+\u003c/span>\u003c/summary>\n    \u003cdiv class=\"page-detail-body\">\u003ca class=\"screenshot-link\" href=\"p00-products-categories.jpg\" target=\"_blank\" rel=\"noopener\" aria-label=\"افتح صورة مكبّرة لصفحة المنتجات والفئات\">\u003cimg src=\"p00-products-categories.jpg\" width=\"1363\" height=\"938\" loading=\"lazy\" alt=\"صفحة المنتجات والفئات من تقرير التحليلات التجارية لقطاع الأدوية السعودي\">\u003c/a>\n    \u003cdiv class=\"page-explanation\">\u003cp class=\"eyebrow\">الفترة · منطقة العميل · الفئة\u003c/p>\u003ch3>ماذا تعرض هذه الصفحة؟\u003c/h3>\u003cp>قارن مبيعات الفئات وهامشها، ومزيج الأدوية بوصفة ودون وصفة، والمنتجات الأعلى أداءً، وخريطة ربحية المنتجات. تحدد الخريطة الموقع بالمبيعات والهامش، ويمثل حجم الفقاعة عدد الوحدات.\u003c/p>\u003ch3>جرّب بنفسك\u003c/h3>\u003cp>اختر فئة ومنتجًا مرتفع الإيراد، ثم افحص هامشه ومعدل مرتجعاته. ارتفاع مساهمة المنتج في المبيعات بداية للتحليل، ولا يكفي وحده للحكم على الربحية.\u003c/p>\u003cp class=\"context-note\">\u003cstrong>انتبه إلى السياق.\u003c/strong> يعدّ Products Sold المنتجات المختلفة التي سجلت مبيعات في السياق المختار: 177 في خط الأساس، من أصل 180 منتجًا في الجدول المرجعي.\u003c/p>\u003ca class=\"text-link\" href=\"#dashboard\">جرّب في التقرير التفاعلي ↑\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"page-detail\" id=\"page-04\">\u003csummary>\u003cspan class=\"page-number\">04\u003c/span>\u003cspan>\u003cstrong>العملاء والقنوات · Customers &amp; Channels\u003c/strong>\u003csmall>أي الحسابات ومجموعات العملاء أكثر قيمة؟\u003c/small>\u003c/span>\u003cspan class=\"detail-symbol\" aria-hidden=\"true\">+\u003c/span>\u003c/summary>\n    \u003cdiv class=\"page-detail-body\">\u003ca class=\"screenshot-link\" href=\"p00-customers-channels.jpg\" target=\"_blank\" rel=\"noopener\" aria-label=\"افتح صورة مكبّرة لصفحة العملاء والقنوات\">\u003cimg src=\"p00-customers-channels.jpg\" width=\"1363\" height=\"938\" loading=\"lazy\" alt=\"صفحة العملاء والقنوات من تقرير التحليلات التجارية لقطاع الأدوية السعودي\">\u003c/a>\n    \u003cdiv class=\"page-explanation\">\u003cp class=\"eyebrow\">الفترة · منطقة العميل · نوع العميل\u003c/p>\u003ch3>ماذا تعرض هذه الصفحة؟\u003c/h3>\u003cp>راجع العملاء الذين خُدموا وتكرار الفواتير وقيمة الطلب والهامش. يقدم أداء أنواع العملاء وقنوات الطلب المفضلة والحسابات الأعلى قيمة زوايا متكاملة لفهم قاعدة العملاء.\u003c/p>\u003ch3>جرّب بنفسك\u003c/h3>\u003cp>اختر نوع عميل، وقارن الإيراد بمجمل الهامش، ثم مرّر المؤشر على خريطة قيمة العملاء لفحص تفاصيل الحسابات. يمثل حجم الفقاعة عدد الفواتير.\u003c/p>\u003cp class=\"context-note\">\u003cstrong>انتبه إلى السياق.\u003c/strong> تعرض خريطة القيمة أعلى 100 حساب. قناة الطلب المفضلة صفة للعميل، بينما قناة البيع الفعلية صفة للمعاملة في صفحة المبيعات.\u003c/p>\u003ca class=\"text-link\" href=\"#dashboard\">جرّب في التقرير التفاعلي ↑\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"page-detail\" id=\"page-05\">\u003csummary>\u003cspan class=\"page-number\">05\u003c/span>\u003cspan>\u003cstrong>المندوبون والمستهدفات · Agents &amp; Targets\u003c/strong>\u003csmall>أين ينبغي تركيز مراجعة أداء المبيعات؟\u003c/small>\u003c/span>\u003cspan class=\"detail-symbol\" aria-hidden=\"true\">+\u003c/span>\u003c/summary>\n    \u003cdiv class=\"page-detail-body\">\u003ca class=\"screenshot-link\" href=\"p00-agents-targets.jpg\" target=\"_blank\" rel=\"noopener\" aria-label=\"افتح صورة مكبّرة لصفحة المندوبون والمستهدفات\">\u003cimg src=\"p00-agents-targets.jpg\" width=\"1363\" height=\"938\" loading=\"lazy\" alt=\"صفحة المندوبون والمستهدفات من تقرير التحليلات التجارية لقطاع الأدوية السعودي\">\u003c/a>\n    \u003cdiv class=\"page-explanation\">\u003cp class=\"eyebrow\">الفترة · مندوب المبيعات · منطقة العميل\u003c/p>\u003ch3>ماذا تعرض هذه الصفحة؟\u003c/h3>\u003cp>قارن المبيعات الفعلية بالمستهدف، وافحص الانحراف، واستكشف مناطق المندوبين وأفضل المندوبين وخريطة أدائهم. تميز فئات الأداء بين مستويات تحقيق المستهدف.\u003c/p>\u003ch3>جرّب بنفسك\u003c/h3>\u003cp>اترك Region على All، واختر سنة ومندوبًا، واقرأ نسبة التحقيق مع الانحراف عن المستهدف. استخدم رسم مناطق المندوبين لإجراء مقارنة إقليمية على أساس مستهدف متسق.\u003c/p>\u003cp class=\"context-note\">\u003cstrong>انتبه إلى السياق.\u003c/strong> فئات المشروع: 100% فأكثر تحقيق أو تجاوز؛ من 95% إلى أقل من 100% قريب من الهدف؛ من 90% إلى أقل من 95% معرض للخطر؛ أقل من 90% حرج. هذه قواعد المشروع وليست معيارًا عامًا للصناعة.\u003c/p>\u003ca class=\"text-link\" href=\"#dashboard\">جرّب في التقرير التفاعلي ↑\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"page-detail\" id=\"page-06\">\u003csummary>\u003cspan class=\"page-number\">06\u003c/span>\u003cspan>\u003cstrong>المخزون والصلاحية · Inventory &amp; Expiry\u003c/strong>\u003csmall>أين تكون أولوية توافر المخزون أو فحص الصلاحية أعلى؟\u003c/small>\u003c/span>\u003cspan class=\"detail-symbol\" aria-hidden=\"true\">+\u003c/span>\u003c/summary>\n    \u003cdiv class=\"page-detail-body\">\u003ca class=\"screenshot-link\" href=\"p00-inventory-expiry.jpg\" target=\"_blank\" rel=\"noopener\" aria-label=\"افتح صورة مكبّرة لصفحة المخزون والصلاحية\">\u003cimg src=\"p00-inventory-expiry.jpg\" width=\"1363\" height=\"938\" loading=\"lazy\" alt=\"صفحة المخزون والصلاحية من تقرير التحليلات التجارية لقطاع الأدوية السعودي\">\u003c/a>\n    \u003cdiv class=\"page-explanation\">\u003cp class=\"eyebrow\">المستودع · الفئة · حالة المخزون\u003c/p>\u003ch3>ماذا تعرض هذه الصفحة؟\u003c/h3>\u003cp>استخدم لقطة المخزون لمراجعة القيمة والتغطية والمواقع التي تقل عن حد إعادة الطلب ونفاد المخزون والتعرض لانتهاء الصلاحية. تساعد مقارنات المستودعات ومزيج الحالات وأولويات التوريد على تحديد الخطوة التالية.\u003c/p>\u003ch3>جرّب بنفسك\u003c/h3>\u003cp>اختر مستودعًا، وافحص مواقع النفاد والنقص عن حد إعادة الطلب، ثم قارن مخاطر الصلاحية حسب الفئة. استخدم فلتر حالة المخزون لتركيز المراجعة ثم امسحه للعودة إلى خط الأساس الكامل.\u003c/p>\u003cp class=\"context-note\">\u003cstrong>انتبه إلى السياق.\u003c/strong> هذه لقطة بتاريخ 31 أغسطس 2026. يشير التعرض للصلاحية إلى القيمة الكاملة لموقع مخزني أقرب تاريخ صلاحية فيه خلال 90 يومًا أو مضى بالفعل؛ ولا يمثل تقديرًا للشطب على مستوى الدفعات.\u003c/p>\u003ca class=\"text-link\" href=\"#dashboard\">جرّب في التقرير التفاعلي ↑\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/section>\n\u003csection class=\"case-section guide-section\" id=\"user-guide\">\u003cdiv class=\"section-label\">04 / طريقة استخدام التقرير\u003c/div>\u003cdiv class=\"section-heading\">\u003ch2>جولة عملية\u003cbr>في ثلاث دقائق.\u003c/h2>\u003cp>اتبع هذه الخطوات قبل التجربة بفلاتر أكثر تفصيلًا. اقرأ الفلاتر المختارة كلما فسّرت رقمًا.\u003c/p>\u003c/div>\n\u003col class=\"guide-steps\">\u003cli>\u003cspan>01\u003c/span>\u003cdiv>\u003ch3>ابدأ بخط الأساس\u003c/h3>\u003cp>حمّل التقرير وافتح \u003cstrong>النظرة العامة · Executive Overview\u003c/strong>. ابدأ مع Period وRegion على \u003cstrong>الكل (All)\u003c/strong>. يعرض خط الأساس نحو 242.0 مليون ريال صافي مبيعات، وهامشًا 31.9%، وتحقيقًا للمستهدف 97.2%.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cspan>02\u003c/span>\u003cdiv>\u003ch3>حدد السؤال ثم الصفحة\u003c/h3>\u003cp>استخدم Sales Performance لمحركات الإيراد، وProducts &amp; Categories لمزيج المنتجات، وCustomers &amp; Channels لقيمة الحسابات، وAgents &amp; Targets للمستهدفات، وInventory &amp; Expiry لمخاطر المخزون.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cspan>03\u003c/span>\u003cdiv>\u003ch3>استخدم الفلاتر لهدف محدد\u003c/h3>\u003cp>استخدم القوائم أعلى التقرير. اختر سنة أو فئة لتحديد نطاق السؤال. قد تسمح الفلاتر باختيارات متعددة؛ راجع الاختيار المعروض قبل المقارنة. تستخدم صفحة المخزون المستودع والفئة وحالة المخزون بدلًا من فترة المبيعات.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cspan>04\u003c/span>\u003cdiv>\u003ch3>استكشف التفاصيل المساندة\u003c/h3>\u003cp>على الكمبيوتر، مرّر المؤشر على الأعمدة أو النقاط أو القطاعات لعرض قيم إضافية. يفلتر اختيار عنصر في الرسم أو يبرز العناصر المرتبطة به. تحتفظ بعض المقارنات بسياقها الأصلي عمدًا.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cspan>05\u003c/span>\u003cdiv>\u003ch3>امسح الاختيارات قبل تغيير السؤال\u003c/h3>\u003cp>اضغط العنصر المختار في الرسم مرة أخرى لإلغاء اختياره. وفي الفلاتر، استخدم زر مسح الاختيار إن توفر أو Select all. زر \u003cstrong>إعادة ضبط التقرير\u003c/strong> أعلاه يعيد تحميل التقرير من صفحته الأولى.\u003c/p>\u003c/div>\u003c/li>\u003c/ol>\n\u003cdiv class=\"scenario-grid\">\u003carticle>\u003cspan class=\"eyebrow\">مثال للاستكشاف\u003c/span>\u003ch3>المبيعات والهامش\u003c/h3>\u003cp>افتح Products &amp; Categories ← اختر السنة والفئة ← قارن المبيعات بالهامش ← مرّر المؤشر على منتج مرتفع الإيراد. افحص ما إذا كان الحجم أو السعر أو المزيج يحتاج إلى مزيد من التحليل.\u003c/p>\u003c/article>\u003carticle>\u003cspan class=\"eyebrow\">مثال للاستكشاف\u003c/span>\u003ch3>تحقيق مستهدف المندوب\u003c/h3>\u003cp>افتح Agents &amp; Targets ← اترك Region على All ← اختر السنة والمندوب ← قارن المبيعات الفعلية وتحقيق المستهدف والانحراف. استخدم رسم مناطق المندوبين للمقارنة الإقليمية.\u003c/p>\u003c/article>\u003carticle>\u003cspan class=\"eyebrow\">مثال للاستكشاف\u003c/span>\u003ch3>توافر المخزون\u003c/h3>\u003cp>افتح Inventory &amp; Expiry ← اختر المستودع ← راجع النفاد والنقص عن حد إعادة الطلب ← افحص رسم إعادة التوريد ← امسح فلتر الحالة قبل مقارنة إجمالي التعرض للصلاحية.\u003c/p>\u003c/article>\u003c/div>\n\u003cdetails class=\"inline-details arabic-guide\" lang=\"ar\" dir=\"rtl\">\u003csummary>دليل استخدام مختصر بالعربية\u003c/summary>\u003col>\u003cli>اضغط \u003cbdi>تحميل التقرير التفاعلي\u003c/bdi>، وابدأ بصفحة \u003cbdi>النظرة العامة · Executive Overview\u003c/bdi> مع الفلاتر على \u003cbdi>الكل (All)\u003c/bdi>.\u003c/li>\u003cli>اختر الصفحة المناسبة لسؤالك من القائمة داخل التقرير، ثم حدّد السنة أو الفئة أو العميل حسب الصفحة.\u003c/li>\u003cli>مرّر المؤشر على الرسوم في الكمبيوتر لإظهار التفاصيل. اختيار عمود أو نقطة قد يفلتر الرسوم المرتبطة به.\u003c/li>\u003cli>عند مقارنة المستهدف، اترك فلتر \u003cbdi>المنطقة (Region)\u003c/bdi> على \u003cbdi>الكل (All)\u003c/bdi> واستخدم السنة ومندوب المبيعات؛ فلتر منطقة العميل لا يغيّر المستهدف في النسخة الحالية.\u003c/li>\u003cli>صفحة المخزون لقطة بتاريخ 31 أغسطس 2026. قيمة خطر الصلاحية تشير إلى مخزون يحتاج للفحص، وليست خسارة مؤكدة.\u003c/li>\u003cli>للعودة إلى البداية اضغط \u003cbdi>إعادة ضبط التقرير\u003c/bdi>. على الموبايل استخدم الوضع الأفقي أو \u003cbdi>فتح التقرير كاملًا\u003c/bdi>.\u003c/li>\u003c/ol>\u003c/details>\u003c/section>\n\u003csection class=\"case-section\" id=\"model\">\u003cdiv class=\"section-label\">05 / البيانات والتنفيذ\u003c/div>\u003cdiv class=\"section-heading\">\u003ch2>أسئلة مختلفة.\u003cbr>ومستويات تفصيل مختلفة.\u003c/h2>\u003cp>يفصل النموذج بين المبيعات على مستوى المعاملة، والمستهدفات الشهرية للمندوبين، ولقطة المخزون؛ حتى تُفسر مقاييس كل منها بصورة صحيحة.\u003c/p>\u003c/div>\n\u003cdiv class=\"method-grid\">\u003carticle>\u003cspan class=\"small-index\">01 / تجهيز\u003c/span>\u003ch3>Excel → Power Query\u003c/h3>\u003cp>استيراد جداول ملف Excel الاصطناعي، وترقية العناوين، وتحديد أنواع الأعمدة، وتوحيد بعض مسميات العرض. ثم إلحاق استعلامات مبيعات 2023–2026 في جدول \u003ccode dir=\"ltr\">Pharma_Sales\u003c/code>.\u003c/p>\u003c/article>\u003carticle>\u003cspan class=\"small-index\">02 / نمذجة\u003c/span>\u003ch3>ثلاثة جداول وقائع\u003c/h3>\u003cp>ربط المبيعات والمستهدفات والمخزون بالأبعاد المناسبة. يتضمن النموذج المفحوص \u003cstrong>11 علاقة نشطة من متعدد إلى واحد\u003c/strong>، وكلها بفلترة في اتجاه واحد.\u003c/p>\u003c/article>\u003carticle>\u003cspan class=\"small-index\">03 / حساب\u003c/span>\u003ch3>DAX بسياق واضح\u003c/h3>\u003cp>استخدام الجمع والعد الفريد والنسب والترتيب والتحقق من السياق. تشمل التعريفات السبعون أيضًا تسميات ومساعدات للتنسيق الشرطي.\u003c/p>\u003c/article>\u003carticle>\u003cspan class=\"small-index\">04 / شرح\u003c/span>\u003ch3>نشر وتوثيق\u003c/h3>\u003cp>تنظيم ست صفحات، ونشر التقرير التفاعلي في Power BI Service، وشرح تعريفات المقاييس وقواعد التفسير وحدود لقطة المخزون هنا.\u003c/p>\u003c/article>\u003c/div>\n\u003cdiv class=\"table-scroll\" role=\"region\" aria-label=\"مستويات تفصيل جداول البيانات وأعداد السجلات\" tabindex=\"0\">\u003ctable>\u003ccaption>نظرة على نموذج البيانات · الأعداد من نسخة PBIX المفحوصة\u003c/caption>\u003cthead>\u003ctr>\u003cth>البيانات\u003c/th>\u003cth>الجدول\u003c/th>\u003cth>الصفوف\u003c/th>\u003cth>مستوى التفصيل\u003c/th>\u003cth>التفسير\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>سطر مبيعات\u003c/td>\u003ctd>Pharma_Sales\u003c/td>\u003ctd>150,000\u003c/td>\u003ctd>سطر واحد من فاتورة\u003c/td>\u003ctd>التاريخ والعميل والمنتج والمندوب والمستودع\u003c/td>\u003c/tr>\u003ctr>\u003ctd>مستهدفات المبيعات\u003c/td>\u003ctd>Sales_Targets\u003c/td>\u003ctd>2,592\u003c/td>\u003ctd>شهر واحد × مندوب واحد\u003c/td>\u003ctd>التاريخ ومندوب المبيعات\u003c/td>\u003c/tr>\u003ctr>\u003ctd>لقطة المخزون\u003c/td>\u003ctd>Inventory\u003c/td>\u003ctd>1,080\u003c/td>\u003ctd>مستودع واحد × صنف واحد في تاريخ اللقطة\u003c/td>\u003ctd>المنتج والمستودع والمورّد\u003c/td>\u003c/tr>\u003ctr>\u003ctd>المنتجات\u003c/td>\u003ctd>Linked_Drugs\u003c/td>\u003ctd>180\u003c/td>\u003ctd>منتج / صنف واحد\u003c/td>\u003ctd>177 منتجًا لها مبيعات مسجلة\u003c/td>\u003c/tr>\u003ctr>\u003ctd>العملاء\u003c/td>\u003ctd>العملاء\u003c/td>\u003ctd>1,200\u003c/td>\u003ctd>حساب واحد\u003c/td>\u003ctd>1,148 عميلًا لهم مبيعات؛ تستخدم جغرافيا العملاء CityID\u003c/td>\u003c/tr>\u003ctr>\u003ctd>مندوبو المبيعات\u003c/td>\u003ctd>Sales_Agents\u003c/td>\u003ctd>72\u003c/td>\u003ctd>مندوب واحد\u003c/td>\u003ctd>منطقة المندوب أساس المقارنة الإقليمية للمستهدفات\u003c/td>\u003c/tr>\u003ctr>\u003ctd>المورّدون / المستودعات\u003c/td>\u003ctd>Suppliers / Warehouses\u003c/td>\u003ctd>40 / 6\u003c/td>\u003ctd>مورّد واحد / مستودع واحد\u003c/td>\u003ctd>بيانات مرجعية لتحليل المخزون\u003c/td>\u003c/tr>\u003ctr>\u003ctd>الجغرافيا / التواريخ\u003c/td>\u003ctd>Geography / Date\u003c/td>\u003ctd>27 / 1,096\u003c/td>\u003ctd>مدينة واحدة / يوم تقويمي واحد\u003c/td>\u003ctd>الفترة: 1 سبتمبر 2023 – 31 أغسطس 2026\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"model-note-grid\">\u003cdiv>\u003ch3>كيف تنتقل الفلاتر؟\u003c/h3>\u003cp>يفلتر التاريخ المبيعات والمستهدفات. يفلتر المنتج والمستودع المبيعات والمخزون. يفلتر المندوب المبيعات والمستهدفات. تفلتر جغرافيا العميل العملاء ثم المبيعات، ويفلتر المورّد المخزون.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>لماذا يهم سياق المستهدف؟\u003c/h3>\u003cp>المستهدفات غير موزعة على منتجات أو عملاء بعينهم. يُرجع مقياس الصلاحية قيمة فارغة للاختيارات التي يفحصها صراحة على المنتج أو العميل. لا يشمل ذلك فلتر جغرافيا العميل المنفصل، لذا اتركه على All عند مقارنة المستهدفات.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>لماذا يُفصل المخزون؟\u003c/h3>\u003cp>المخزون وضع في تاريخ محدد، وليس سجل حركات. لا يرتبط ببُعد تاريخ المبيعات؛ لذلك لا يعبّر اختيار سنة المبيعات عن مخزون تاريخي.\u003c/p>\u003c/div>\u003c/div>\n\u003cdetails class=\"inline-details\">\u003csummary>افحص خريطة العلاقات الفعلية\u003c/summary>\u003cdiv class=\"table-scroll\">\u003ctable>\u003ccaption>بُعد ← جدول وقائع أو بُعد تابع · واحد إلى متعدد، واتجاه فلترة واحد\u003c/caption>\u003cthead>\u003ctr>\u003cth>مفتاح البُعد\u003c/th>\u003cth>المفتاح المرتبط\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Date.DateKey\u003c/td>\u003ctd>Pharma_Sales.DateKey\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Date.DateKey\u003c/td>\u003ctd>Sales_Targets.TargetMonthDateKey\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Customers.CustomerID\u003c/td>\u003ctd>Pharma_Sales.CustomerID\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Linked_Drugs.DrugID\u003c/td>\u003ctd>Pharma_Sales.DrugID\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sales_Agents.SalesAgentID\u003c/td>\u003ctd>Pharma_Sales.SalesAgentID\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Warehouses.WarehouseID\u003c/td>\u003ctd>Pharma_Sales.WarehouseID\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Geography.CityID\u003c/td>\u003ctd>Customers.CityID\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Linked_Drugs.DrugID\u003c/td>\u003ctd>Inventory.DrugID\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Suppliers.SupplierID\u003c/td>\u003ctd>Inventory.SupplierID\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Warehouses.WarehouseID\u003c/td>\u003ctd>Inventory.WarehouseID\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sales_Agents.SalesAgentID\u003c/td>\u003ctd>Sales_Targets.SalesAgentID\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/details>\u003c/section>\n\u003csection class=\"case-section metric-section\" id=\"metrics\">\u003cdiv class=\"section-label\">06 / قاموس المقاييس\u003c/div>\u003cdiv class=\"section-heading\">\u003ch2>اعرف ما الذي\u003cbr>يعنيه الرقم.\u003c/h2>\u003cp>تستخدم قيم خط الأساس أدناه كل بيانات المبيعات أو لقطة المخزون كاملة. قد تقرّب بطاقات التقرير هذه القيم. K تعني ألفًا وM تعني مليونًا.\u003c/p>\u003c/div>\u003cdiv class=\"table-scroll\" role=\"region\" aria-label=\"تعريفات المقاييس\" tabindex=\"0\">\u003ctable class=\"metric-table\">\u003ccaption>المقاييس الرئيسية · خط الأساس الكامل · العملة ريال سعودي ما لم يُذكر خلاف ذلك\u003c/caption>\u003cthead>\u003ctr>\u003cth>المقياس\u003c/th>\u003cth>طريقة الحساب\u003c/th>\u003cth>كيفية التفسير\u003c/th>\u003cth>خط الأساس\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>صافي المبيعات\u003c/td>\u003ctd>Σ NetSalesExclVATSAR\u003c/td>\u003ctd>المبيعات بعد الخصومات والمرتجعات، باستبعاد ضريبة القيمة المضافة. مقياس الإيراد الرئيسي.\u003c/td>\u003ctd>241,967,508.82 ر.س\u003c/td>\u003c/tr>\u003ctr>\u003ctd>المبيعات الإجمالية\u003c/td>\u003ctd>Σ GrossSalesSAR\u003c/td>\u003ctd>الإيراد قبل الخصومات والمرتجعات.\u003c/td>\u003ctd>256,789,996.85 ر.س\u003c/td>\u003c/tr>\u003ctr>\u003ctd>مجمل الربح\u003c/td>\u003ctd>Σ GrossProfitSAR\u003c/td>\u003ctd>مجموع مجمل الربح المخزن لسطور المبيعات المختارة. لا يساوي صافي الربح.\u003c/td>\u003ctd>77,293,391.47 ر.س\u003c/td>\u003c/tr>\u003ctr>\u003ctd>هامش مجمل الربح\u003c/td>\u003ctd>مجمل الربح ÷ صافي المبيعات\u003c/td>\u003ctd>نسبة مجموعين؛ لا تستخدم متوسط نسب الهامش على مستوى الصفوف.\u003c/td>\u003ctd>31.94%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>عدد الفواتير\u003c/td>\u003ctd>عدّ InvoiceNumber دون تكرار\u003c/td>\u003ctd>الفواتير الفريدة، وليس عدد سطور المبيعات.\u003c/td>\u003ctd>48,613\u003c/td>\u003c/tr>\u003ctr>\u003ctd>متوسط قيمة الطلب\u003c/td>\u003ctd>صافي المبيعات ÷ عدد الفواتير\u003c/td>\u003ctd>متوسط الإيراد لكل فاتورة في السياق المختار.\u003c/td>\u003ctd>4,977.42 ر.س\u003c/td>\u003c/tr>\u003ctr>\u003ctd>معدل الخصم\u003c/td>\u003ctd>قيمة الخصومات ÷ المبيعات الإجمالية\u003c/td>\u003ctd>نسبة الإيراد الإجمالي الممنوحة كخصومات.\u003c/td>\u003ctd>5.49%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>معدل المرتجعات\u003c/td>\u003ctd>الوحدات المرتجعة ÷ الوحدات المبيعة\u003c/td>\u003ctd>معدل يعتمد على الوحدات؛ لا يساوي قيمة المرتجعات مقسومة على الإيراد.\u003c/td>\u003ctd>0.30%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>المنتجات المبيعة / العملاء المخدومون\u003c/td>\u003ctd>عدّ المعرّفات الفريدة في Pharma_Sales\u003c/td>\u003ctd>يقيس النشاط في الفترة المختارة، وليس جميع السجلات المرجعية.\u003c/td>\u003ctd>177 منتجًا / 1,148 مشتريًا\u003c/td>\u003c/tr>\u003ctr>\u003ctd>تحقيق المستهدف\u003c/td>\u003ctd>صافي المبيعات ÷ مستهدف المبيعات\u003c/td>\u003ctd>قارن على نطاق متوافق من حيث الفترة ومندوب المبيعات أو منطقته.\u003c/td>\u003ctd>97.18%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>الانحراف عن المستهدف\u003c/td>\u003ctd>صافي المبيعات − مستهدف المبيعات\u003c/td>\u003ctd>القيمة السالبة تعني أن المبيعات أقل من المستهدف.\u003c/td>\u003ctd>−7,019,083.84 ر.س\u003c/td>\u003c/tr>\u003ctr>\u003ctd>قيمة المخزون\u003c/td>\u003ctd>Σ InventoryValueSAR\u003c/td>\u003ctd>القيمة المخزنة في مواقع المستودع–الصنف المختارة في تاريخ اللقطة.\u003c/td>\u003ctd>7,920,403.77 ر.س\u003c/td>\u003c/tr>\u003ctr>\u003ctd>تغطية المخزون\u003c/td>\u003ctd>وحدات المخزون ÷ متوسط وحدات الطلب اليومي\u003c/td>\u003ctd>تغطية مرجحة بالطلب عبر المواقع المختارة، وليست متوسط نسب تغطية المواقع منفردة.\u003c/td>\u003ctd>53.18 يومًا\u003c/td>\u003c/tr>\u003ctr>\u003ctd>مخاطر إعادة التوريد\u003c/td>\u003ctd>عدّ المواقع التي يقل مخزونها عن حد إعادة الطلب\u003c/td>\u003ctd>تشمل المواقع ذات المخزون الصفري. تُعدّ المواقع لا المنتجات الفريدة.\u003c/td>\u003ctd>182 موقعًا مخزنيًا\u003c/td>\u003c/tr>\u003ctr>\u003ctd>فجوة إعادة الطلب\u003c/td>\u003ctd>مجموع القيم الموجبة لـ(حد إعادة الطلب − المخزون)\u003c/td>\u003ctd>الوحدات اللازمة للوصول إلى حدود إعادة الطلب المسجلة. لا تمثل توصية مكتملة بأمر شراء.\u003c/td>\u003ctd>11,006 وحدات\u003c/td>\u003c/tr>\u003ctr>\u003ctd>معدل نفاد المخزون\u003c/td>\u003ctd>المواقع ذات المخزون الصفري ÷ المواقع المؤهلة\u003c/td>\u003ctd>يزيل المقام فلتر Stock Status مع الاحتفاظ بالفلاتر الأخرى المنطبقة.\u003c/td>\u003ctd>27 / 1,080 = 2.50%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>التعرض لانتهاء الصلاحية\u003c/td>\u003ctd>قيمة المواقع ذات المخزون الموجب وأقرب صلاحية خلال 90 يومًا أو قبل ذلك\u003c/td>\u003ctd>يشمل المخزون المنتهي والقريب من الانتهاء خلال 90 يومًا. يشير إلى القيمة الكاملة للموقع، ولا يحسب خسائر الدفعات.\u003c/td>\u003ctd>825,385.46 ريال / 115 موقعًا\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdetails class=\"code-details\">\u003csummary>ثلاثة أمثلة فعلية من DAX\u003c/summary>\u003cdiv class=\"code-grid\">\u003cdiv>\u003ch3>نسبة مجموعين\u003c/h3>\u003cpre dir=\"ltr\">\u003ccode dir=\"ltr\">Gross Margin % =\nDIVIDE ( [Gross Profit], [Net Sales] )\u003c/code>\u003c/pre>\u003cp>تحافظ هذه الصيغة على الهامش المرجح للمبيعات المختارة بدلًا من متوسط نسب السطور.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>عدّ وحدة أعمال دون تكرار\u003c/h3>\u003cpre dir=\"ltr\">\u003ccode dir=\"ltr\">Invoice Count =\nDISTINCTCOUNT ( Pharma_Sales[InvoiceNumber] )\u003c/code>\u003c/pre>\u003cp>قد تتضمن الفاتورة سطورًا متعددة، لكنها تظل فاتورة واحدة.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>تغطية مخزون مرجحة بالطلب\u003c/h3>\u003cpre dir=\"ltr\">\u003ccode dir=\"ltr\">Stock Coverage Days =\nDIVIDE ( [Inventory Units], [Daily Demand Units] )\u003c/code>\u003c/pre>\u003cp>تستخدم النتيجة إجمالي المخزون والطلب المختارين، فيحصل الموقع الأعلى طلبًا على وزنه المناسب.\u003c/p>\u003c/div>\u003c/div>\u003c/details>\n\u003ca class=\"text-link\" href=\"https://github.com/shamseldeen/Shamseldeen.github.io/blob/main/power-bi-measures.md\" target=\"_blank\" rel=\"noopener\">اقرأ تعريفات DAX السبعين على GitHub ↗\u003c/a>\u003c/section>\n\u003csection class=\"case-section\" id=\"findings\">\u003cdiv class=\"section-label\">07 / النتائج وأسئلة القرار\u003c/div>\u003cdiv class=\"section-heading\">\u003ch2>حوّل الملاحظات\u003cbr>إلى أسئلة للفحص.\u003c/h2>\u003cp>تصف هذه الملاحظات بيانات المشروع الاصطناعية دون فلاتر. الخطوات المقترحة أسئلة تحليلية تالية، ولا تمثل نتائج تحققت في شركة فعلية.\u003c/p>\u003c/div>\n\u003cdiv class=\"finding-grid\">\u003carticle>\u003cspan class=\"finding-value\">97.18%\u003c/span>\u003ch3>المبيعات قريبة من المستهدف\u003c/h3>\u003cp>صافي المبيعات 241.97 مليون ريال مقابل مستهدف 248.99 مليون ريال، بفجوة تبلغ 7.02 مليون ريال.\u003c/p>\u003cp class=\"next-question\">\u003cstrong>السؤال التالي:\u003c/strong> أي الأشهر والمندوبين يسهم أكثر في الفجوة؟ وهل يتعلق السبب بالحجم أم بالمزيج؟\u003c/p>\u003c/article>\u003carticle>\u003cspan class=\"finding-value\">14.82 مليون ر.س\u003c/span>\u003ch3>الفرق بين الإجمالي والصافي\u003c/h3>\u003cp>تفسر خصومات بقيمة 14.10 مليون ريال ومرتجعات بقيمة 0.73 مليون ريال الفرق بين المبيعات الإجمالية والصافية.\u003c/p>\u003cp class=\"next-question\">\u003cstrong>السؤال التالي:\u003c/strong> أي العروض والقنوات تجمع بين خصومات مرتفعة وهامش أقل؟\u003c/p>\u003c/article>\u003carticle>\u003cspan class=\"finding-value\">182 موقعًا مخزنيًا\u003c/span>\u003ch3>إعادة التوريد تحتاج إلى مراجعة\u003c/h3>\u003cp>هناك 182 موقع مستودع–صنف أقل من حد إعادة الطلب، منها 27 موقعًا بلا مخزون. وتبلغ الفجوة الإجمالية للوصول إلى الحدود المسجلة 11,006 وحدات.\u003c/p>\u003cp class=\"next-question\">\u003cstrong>السؤال التالي:\u003c/strong> أي تركيبات المستودع والمنتج تستحق الأولوية بالنظر إلى الطلب ومدة التوريد؟\u003c/p>\u003c/article>\u003carticle>\u003cspan class=\"finding-value\">825.4 ألف ر.س\u003c/span>\u003ch3>مخاطر صلاحية تحتاج إلى فحص\u003c/h3>\u003cp>يوجد 115 موقعًا بمخزون موجب أقرب صلاحية فيه خلال 90 يومًا أو انتهت بالفعل. يشمل المؤشر القيمة المخزنية الكاملة لهذه المواقع.\u003c/p>\u003cp class=\"next-question\">\u003cstrong>السؤال التالي:\u003c/strong> ماذا تُظهر كميات الدفعات وتواريخها قبل تقدير خسارة أو اتخاذ قرار مخزني؟\u003c/p>\u003c/article>\u003c/div>\u003c/section>\n\u003csection class=\"case-section validation-section\" id=\"validation\">\u003cdiv class=\"section-label\">08 / التحقق والنطاق والتطوير التالي\u003c/div>\u003cdiv class=\"section-heading\">\u003ch2>أدلة واضحة.\u003cbr>وحدود معلنة.\u003c/h2>\u003cp>يوضح البورتفوليو المفيد ما جرى فحصه، وما الذي يحتاج إلى تطوير إضافي.\u003c/p>\u003c/div>\n\u003cdiv class=\"validation-grid\">\u003carticle>\u003ch3>الفحوص المكتملة\u003c/h3>\u003cul class=\"check-list\">\u003cli>150,000 معرّف فريد لسطر المبيعات؛ تطابق عدد الفواتير مع 48,613.\u003c/li>\u003cli>لا توجد مفاتيح مكررة لشهر × مندوب في المستهدفات، أو مستودع × صنف في لقطة المخزون المستخرجة.\u003c/li>\u003cli>تطابقت مفاتيح العلاقات الإحدى عشرة بعد توحيد أنواعها، وكانت مفاتيح الأبعاد فريدة.\u003c/li>\u003cli>تطابقت المبيعات الإجمالية مطروحًا منها الخصومات والمرتجعات مع صافي المبيعات.\u003c/li>\u003cli>توافقت حسابات خط الأساس للمبيعات والربح والمستهدف والمخزون مع البطاقات المعروضة بعد التقريب.\u003c/li>\u003cli>يفتح التقرير المنشور دون تسجيل دخول؛ جرى فحص التنقل بين الصفحات واستجابة فلتر السنة.\u003c/li>\u003c/ul>\u003cp class=\"project-note\">تشمل هذه الفحوص النسخة المخزنة وتفاعلات مختارة؛ ولا تمثل تحققًا شاملًا من كل سياقات DAX أو سيناريوهات التقارير.\u003c/p>\u003c/article>\u003carticle>\u003ch3>الحدود الحالية\u003c/h3>\u003cul>\u003cli>\u003cstrong>بيانات اصطناعية:\u003c/strong> NajdCare Pharma علامة افتراضية للمشروع. لا تتعلق البيانات بجهة عملي ولا تتضمن سجلات مرضى.\u003c/li>\u003cli>\u003cstrong>الجغرافيا والمستهدفات:\u003c/strong> يغير فلتر منطقة العميل المبيعات دون خفض المستهدف. اترك Region على All عند قراءة نسبة التحقيق، واستخدم تحليل المندوبين ومناطقهم.\u003c/li>\u003cli>\u003cstrong>لقطة المخزون:\u003c/strong> تاريخ واحد مع معلومات أقرب صلاحية. لا تشمل حركات المخزون التاريخية أو حسابًا دقيقًا لشطب الدفعات.\u003c/li>\u003cli>\u003cstrong>تحليل وصفي:\u003c/strong> الفروق بين العروض والقنوات والعملاء لا تثبت السببية.\u003c/li>\u003cli>\u003cstrong>عينة منشورة ثابتة:\u003c/strong> لا تعرض الدراسة ربطًا حيًا بنظام ERP أو تحديثًا إنتاجيًا مجدولًا.\u003c/li>\u003c/ul>\u003c/article>\u003c/div>\n\u003cdiv class=\"next-iteration\">\u003cspan class=\"eyebrow\">أولويات النسخة التالية\u003c/span>\u003cp>مواءمة جغرافيا العملاء مع نموذج المستهدفات، وتوسيع فحوص صلاحية السياق، وإضافة صلاحية الدفعات وحركات المخزون، ثم توسيع اختبارات الاستخدام والأداء. هذه تطويرات مخططة، منفصلة عن الخصائص المنجزة في هذه النسخة.\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"case-section faq-section\" id=\"faq\">\u003cdiv class=\"section-label\">09 / أسئلة شائعة\u003c/div>\u003ch2>قبل أن تستكشف.\u003c/h2>\u003cdetails class=\"inline-details\">\u003csummary>هل هذه بيانات شركة حقيقية؟\u003c/summary>\u003cp>لا. هي بيانات تدريب اصطناعية لموزّع أدوية سعودي افتراضي. يوضح المشروع طرق التحليل وتفسير الأعمال، ولا يعرض أداء صيدليات الدواء أو أي جهة عمل فعلية.\u003c/p>\u003c/details>\u003cdetails class=\"inline-details\">\u003csummary>لماذا تظهر شرطة بدل بعض مقاييس المستهدف؟\u003c/summary>\u003cp>يتحقق التقرير من صلاحية بعض اختيارات المنتجات والعملاء. تعني الشرطة أن مقارنة المستهدف غير متاحة في ذلك السياق، ولا تعني صفرًا. لا تغطي الحماية كل الفلاتر الممكنة؛ راجع إرشادات المستهدفات أعلاه.\u003c/p>\u003c/details>\u003cdetails class=\"inline-details\">\u003csummary>لماذا لا تتغير تسميات نطاق البيانات عند استخدام الفلاتر؟\u003c/summary>\u003cp>تزيل تسميات نطاق التغطية الفلاتر عمدًا لوصف مجموعة البيانات واللقطة كاملة. وتظل مؤشرات الأداء تستجيب للفلاتر المنطبقة عليها.\u003c/p>\u003c/details>\u003cdetails class=\"inline-details\">\u003csummary>هل يمكن استكشاف التقرير على الهاتف؟\u003c/summary>\u003cp>نعم. يستخدم التقرير العام مساحة تصميم سطح المكتب داخل الإطار. استخدم الوضع الأفقي أو افتح التقرير كاملًا لمساحة أكبر. تتكيف دراسة الحالة وصور الصفحات والدليل المحيط به مع الشاشات الصغيرة.\u003c/p>\u003c/details>\u003cdetails class=\"inline-details\">\u003csummary>أين أراجع منطق الحساب؟\u003c/summary>\u003cp>يشرح قاموس المقاييس الحسابات الرئيسية، ويسرد قسم نموذج البيانات العلاقات ومستوى التفصيل، ويضم مرجع DAX المرتبط جميع صيغ المقاييس السبعين من مصدر المشروع.\u003c/p>\u003c/details>\u003c/section>\n\u003csection class=\"contact section case-contact\">\u003cdiv class=\"contact-inner\">\u003cp class=\"eyebrow\">خبرة صيدلانية. أسئلة أعمال. تحليل عملي.\u003c/p>\u003ch2>لنتحدث عن\u003cbr>القرار القادم.\u003c/h2>\u003cp>متاح لفرص تحليل البيانات وذكاء الأعمال والتقارير وتحليلات الرعاية الصحية والتجزئة.\u003c/p>\u003cdiv class=\"contact-links\">\u003ca class=\"button button-light\" href=\"mailto:shams@shamsinsights.com\" dir=\"ltr\">shams@shamsinsights.com\u003c/a>\u003ca href=\"https://www.linkedin.com/in/shamseldeen-ismaiil-53186097\" target=\"_blank\" rel=\"noopener\">LinkedIn ↗\u003c/a>\u003ca href=\"assets/Shamseldeen_Ismaiil_Data_Analyst_CV_AR.pdf\" target=\"_blank\" rel=\"noopener\">عرض السيرة الذاتية ↗\u003c/a>\u003c/div>\u003c/div>\u003c/section>\n\u003c/main>\u003cfooter>\u003cspan>© \u003cspan id=\"year\">\u003c/span> شمس الدين إسماعيل\u003c/span>\u003ca href=\"index-ar.html\">العودة إلى البورتفوليو ↑\u003c/a>\u003c/footer>\u003cscript src=\"script.js?v=arabic3\" defer>\u003c/script>\u003cscript src=\"locale.js?v=arabic3\" defer>\u003c/script>\u003c/body>\u003c/html>\n"};
const page=document.querySelector('#page'),width=document.querySelector('#width'),before=document.querySelector('#before'),after=document.querySelector('#after'),status=document.querySelector('#status');
for(const file of Object.keys(pages)){const option=document.createElement('option');option.value=file;option.textContent=file;page.append(option)}
function measure(){const doc=after.contentDocument,win=after.contentWindow,h1=doc.querySelector('h1'),em=doc.querySelector('h1 em');const parts=[...doc.querySelector('.site-header').children].filter(e=>win.getComputedStyle(e).display!=='none');let overlap=false;for(let i=0;i<parts.length;i++)for(let j=i+1;j<parts.length;j++){const a=parts[i].getBoundingClientRect(),b=parts[j].getBoundingClientRect();if(Math.min(a.right,b.right)-Math.max(a.left,b.left)>1 && Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top)>1)overlap=true;}
const m={page:page.value,width:win.innerWidth,clientWidth:doc.documentElement.clientWidth,fontLoaded:[...doc.fonts].some(f=>f.family.replaceAll('"','')==='Cairo'&&f.status==='loaded'),family:win.getComputedStyle(doc.body).fontFamily,h1Weight:win.getComputedStyle(h1).fontWeight,emWeight:em?win.getComputedStyle(em).fontWeight:null,emStyle:em?win.getComputedStyle(em).fontStyle:null,overflow:Math.max(doc.documentElement.scrollWidth,doc.body.scrollWidth)-doc.documentElement.clientWidth,overlap,brandWidth:doc.querySelector('.brand').getBoundingClientRect().width};document.querySelector('#metrics').textContent=JSON.stringify(m,null,2);return m;}
async function load(){status.textContent='Loading '+page.value;before.style.width=after.style.width=(Number(width.value)+2)+'px';const ready=new Promise(resolve=>{after.onload=async()=>{await after.contentDocument.fonts.ready;requestAnimationFrame(()=>requestAnimationFrame(resolve));}});before.src='https://shamsinsights.com/'+page.value+'?typography=before';after.srcdoc=pages[page.value];await ready;const m=measure();status.textContent='Preview ready';return m;}
page.addEventListener('change',load);width.addEventListener('change',load);
document.querySelector('#run').addEventListener('click',async()=>{const button=document.querySelector('#run');button.disabled=true;document.querySelector('#results').replaceChildren();const oldPage=page.value,oldWidth=width.value;let failures=0;for(const name of Object.keys(pages))for(const size of [320,390,850,1366]){page.value=name;width.value=String(size);const m=await load();const pass=m.fontLoaded&&m.h1Weight==='800'&&m.emStyle==='normal'&&m.emWeight==='800'&&m.overflow<=1&&!m.overlap;if(!pass)failures++;const tr=document.createElement('tr');tr.className=pass?'pass':'fail';for(const v of [name,size,m.fontLoaded,m.h1Weight+' / '+m.emStyle,m.overflow,m.overlap,pass?'PASS':'FAIL']){const td=document.createElement('td');td.textContent=v;tr.append(td)}document.querySelector('#results').append(tr);}page.value=oldPage;width.value=oldWidth;await load();status.textContent='Completed 20 checks; failures: '+failures;button.disabled=false;});load();
