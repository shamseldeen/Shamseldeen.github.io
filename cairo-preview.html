تس\u003c/span>\u003csmall>شمس الدين إسماعيل\u003c/small>\u003c/span>\n  \u003c/a>\n\n  \u003ca class=\"language-switch\" href=\"index.html\" lang=\"en\" hreflang=\"en\" aria-label=\"الانتقال إلى الإنجليزية — English\" data-language-switch=\"\" dir=\"ltr\">\u003csvg viewbox=\"0 0 24 24\" width=\"18\" height=\"18\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\">\u003c/circle>\u003cellipse cx=\"12\" cy=\"12\" rx=\"4\" ry=\"9\">\u003c/ellipse>\u003cpath d=\"M3 12h18\">\u003c/path>\u003c/svg>\u003cspan>English\u003c/span>\u003c/a>\u003cbutton class=\"menu-button\" id=\"menuButton\" aria-controls=\"navigation\" aria-label=\"فتح القائمة\" aria-expanded=\"false\">\n    \u003cspan>\u003c/span>\n    \u003cspan>\u003c/span>\n    \u003cspan>\u003c/span>\n  \u003c/button>\n\n  \u003cnav id=\"navigation\" aria-label=\"القائمة الرئيسية\">\n    \u003ca href=\"#about\">نبذة\u003c/a>\n    \u003ca href=\"#skills\">المهارات\u003c/a>\n    \u003ca href=\"#projects\">المشروعات\u003c/a>\n    \u003ca href=\"#learning\">التعلّم\u003c/a>\n    \u003ca href=\"#experience\">الخبرة\u003c/a>\n    \u003ca class=\"nav-cta\" href=\"#contact\">تواصل\u003c/a>\n  \u003c/nav>\n\n\u003c/header>\n\n\u003cmain id=\"main\">\n\n  \u003csection class=\"hero\" id=\"top\">\n\n    \u003cdiv class=\"hero-copy reveal\">\n\n      \u003cp class=\"eyebrow\">\n        \u003cspan class=\"status-dot\">\u003c/span> متاح لفرص تحليل البيانات وذكاء الأعمال \u003c/p>\n\n      \u003ch1> خبرة صيدلانية.\u003cbr>\n        \u003cem>رؤية تحليلية واضحة.\u003c/em>\n      \u003c/h1>\n\n      \u003cp class=\"hero-intro\"> أجمع خبرة تزيد على 10 سنوات في صيدليات التجزئة مع SQL وPython وPower BI وTableau لتحويل البيانات التشغيلية المعقدة إلى معلومات تدعم قرارات الأعمال. \u003c/p>\n\n      \u003cdiv class=\"hero-actions\">\n\n        \u003ca class=\"button button-primary\" href=\"saudi-pharma-ar.html\"> استكشف المشروع الرئيسي \u003c/a>\n\n        \u003ca class=\"button button-secondary\" href=\"assets/Shamseldeen_Ismaiil_Data_Analyst_CV_AR.pdf\" target=\"_blank\" rel=\"noopener\"> عرض / تنزيل السيرة الذاتية ↗ \u003c/a>\n\n        \u003ca class=\"button button-secondary\" href=\"https://github.com/shamseldeen\" target=\"_blank\" rel=\"noopener\">\n          GitHub ↗\n        \u003c/a>\n\n      \u003c/div>\n\n      \u003cdl class=\"quick-facts\">\n\n        \u003cdiv>\n          \u003cdt>10+\u003c/dt>\n          \u003cdd>سنوات في صيدليات التجزئة\u003c/dd>\n        \u003c/div>\n\n        \u003cdiv>\n          \u003cdt>6 صفحات\u003c/dt>\n          \u003cdd>دراسة حالة بتقرير Power BI تفاعلي\u003c/dd>\n        \u003c/div>\n\n        \u003cdiv>\n          \u003cdt>SQL · BI\u003c/dt>\n          \u003cdd>من البيانات إلى قرارات الأعمال\u003c/dd>\n        \u003c/div>\n\n      \u003c/dl>\n\n    \u003c/div>\n\n    \u003caside class=\"hero-project reveal\" aria-label=\"مشروع Power BI الرئيسي\">\n      \u003cdiv class=\"preview-topline\">\u003cspan class=\"live-dot\">\u003c/span> مشروع منشور \u003cspan>01 / Power BI\u003c/span>\u003c/div>\n      \u003ca class=\"preview-image\" href=\"saudi-pharma-ar.html\" aria-label=\"استكشف التحليلات التجارية لقطاع الأدوية السعودي\">\n        \u003cimg src=\"p00-executive-overview.jpg\" alt=\"النظرة التنفيذية: المبيعات ومجمل الربح وتحقيق المستهدف ومزيج العملاء في تقرير Power BI المنشور\" width=\"1363\" height=\"938\" fetchpriority=\"high\">\n      \u003c/a>\n      \u003cdiv class=\"hero-project-caption\">\u003cspan class=\"eyebrow\">دراسة الحالة الرئيسية\u003c/span>\u003ch2>تحليلات الأدوية\u003cbr>والأداء التجاري\u003c/h2>\u003cp>المبيعات والربحية وقيمة العملاء والمستهدفات ومخاطر المخزون في تجربة تقارير موثقة.\u003c/p>\n        \u003ca class=\"text-link\" href=\"saudi-pharma-ar.html\">استكشف التقرير والمنطق وراءه \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\n      \u003c/div>\n      \u003cdiv class=\"preview-footer\">\u003cspan>150,000 سطر مبيعات\u003c/span>\u003cspan>بيانات اصطناعية · ريال سعودي\u003c/span>\u003c/div>\n    \u003c/aside>\n\n  \u003c/section>\n\n  \u003csection class=\"section\" id=\"about\">\n\n    \u003cdiv class=\"section-label\">01 / نبذة\u003c/div>\n\n    \u003cdiv class=\"about-grid reveal\">\n\n      \u003ch2>فهم المجال يمنح تحليلي سياقًا عمليًا.\u003c/h2>\n\n      \u003cdiv class=\"body-copy\">\n\n        \u003cp> أعمل في صيدليات الدواء منذ 2015، وتشمل خبرتي خدمة العملاء والمبيعات وإجراءات التأمين وعمليات الفروع. تساعدني هذه الخبرة على فهم الأرقام في سياق قرارات التجزئة والرعاية الصحية. \u003c/p>\n\n        \u003cp> أطبّق هذا الفهم في مشروعات تحليلية عملية. يربط مشروع Power BI بين المبيعات والهامش وسلوك العملاء والمستهدفات ومخاطر المخزون. وأطوّر أيضًا مشروعات مستودعات بيانات باستخدام SQL وPython مع توضيح مراحل الإنجاز. هذه مشروعات تعلّم مستقلة ببيانات اصطناعية أو عامة. \u003c/p>\n\n      \u003c/div>\n\n    \u003c/div>\n\n  \u003c/section>\n\n  \u003csection class=\"section skills\" id=\"skills\">\n\n    \u003cdiv class=\"section-label\">02 / المهارات\u003c/div>\n\n    \u003cdiv class=\"skills-grid reveal\">\n\n      \u003carticle>\n        \u003cspan>01\u003c/span>\n        \u003ch3>SQL ومستودعات البيانات\u003c/h3>\n        \u003cp> T-SQL، وربط الجداول، وCTEs، والدوال النافذية، والإجراءات المخزنة، وETL، وبنية Medallion، والنمذجة البعدية. \u003c/p>\n      \u003c/article>\n\n      \u003carticle>\n        \u003cspan>02\u003c/span>\n        \u003ch3>ذكاء الأعمال\u003c/h3>\n        \u003cp> Power BI، ومقاييس DAX وسياق الفلاتر، وPower Query، وتعريف مؤشرات الأداء، والتقارير التفاعلية، وTableau، وعرض النتائج بلغة الأعمال. \u003c/p>\n      \u003c/article>\n\n      \u003carticle>\n        \u003cspan>03\u003c/span>\n        \u003ch3>Python والتحليل\u003c/h3>\n        \u003cp> pandas وNumPy، وتنظيف البيانات، والتحليل الاستكشافي، والتصور البياني، وأتمتة التحليل. \u003c/p>\n      \u003c/article>\n\n      \u003carticle>\n        \u003cspan>04\u003c/span>\n        \u003ch3>الأعمال وفهم المجال\u003c/h3>\n        \u003cp> تحليلات التجزئة، وعمليات الصيدليات، وإجراءات التأمين، والمبيعات وخدمة العملاء، ومؤشرات المخزون. \u003c/p>\n      \u003c/article>\n\n    \u003c/div>\n\n    \u003cdiv class=\"toolbelt reveal\">\n      \u003cspan>SQL Server\u003c/span>\n      \u003cspan>Python\u003c/span>\n      \u003cspan>Power BI\u003c/span>\n      \u003cspan>Tableau\u003c/span>\n      \u003cspan>Excel\u003c/span>\n      \u003cspan>Git\u003c/span>\n      \u003cspan>GitHub\u003c/span>\n    \u003c/div>\n\n  \u003c/section>\n\n  \u003csection class=\"section\" id=\"projects\">\n\n    \u003cdiv class=\"section-heading reveal\">\n\n      \u003cdiv>\n        \u003cdiv class=\"section-label\">03 / مشروعات مختارة\u003c/div>\n        \u003ch2>أسئلة أعمال.\u003cbr>ومشروعات يمكنك استكشافها.\u003c/h2>\n      \u003c/div>\n\n      \u003cp> جرّب تقريرًا تفاعليًا، واقرأ منطق التحليل، وتعرّف إلى النتائج التي يدعمها كل مشروع وحدود تفسيرها. \u003c/p>\n\n    \u003c/div>\n\n    \u003carticle class=\"flagship flagship-bi reveal\">\n      \u003cdiv class=\"project-copy\">\n        \u003cdiv class=\"project-meta\">\u003cspan class=\"badge active\">المشروع الرئيسي · تقرير تفاعلي\u003c/span>\u003cspan>Power BI · Power Query · DAX\u003c/span>\u003c/div>\n        \u003ch3>ذكاء الأعمال لتوزيع الأدوية في السعودية\u003c/h3>\n        \u003cp class=\"project-lead\">مشروع تقارير تجارية من ست صفحات لموزّع أدوية سعودي افتراضي. يربط المبيعات والهامش بالعملاء ومستهدفات مندوبي المبيعات وقرارات المخزون.\u003c/p>\n        \u003cul class=\"project-points\">\u003cli>\u003cstrong>150,000\u003c/strong> سطر مبيعات و \u003cstrong>48,613\u003c/strong> فاتورة خلال ثلاث سنوات\u003c/li>\u003cli>\u003cstrong>70 مقياسًا وتعريفًا بلغة DAX\u003c/strong> تشمل مؤشرات الأداء والترتيب والتحقق من السياق والتنسيق المرئي\u003c/li>\u003cli>\u003cstrong>6 صفحات للتقرير\u003c/strong> مع جولة إرشادية وقاموس للمقاييس وحدود موثقة للتحليل\u003c/li>\u003c/ul>\n        \u003cdiv class=\"hero-actions compact-actions\">\u003ca class=\"button button-primary\" href=\"saudi-pharma-ar.html\">اقرأ دراسة الحالة ↗\u003c/a>\u003ca class=\"button button-secondary\" href=\"saudi-pharma-ar.html#dashboard\">افتح لوحة المعلومات\u003c/a>\u003c/div>\n        \u003cp class=\"project-note\">مشروع بورتفوليو مستقل · بيانات تدريب اصطناعية · لا يتضمن بيانات جهة العمل أو المرضى\u003c/p>\n      \u003c/div>\n      \u003ca class=\"architecture-card report-preview\" href=\"saudi-pharma-ar.html#dashboard\">\u003cimg src=\"p00-executive-overview.jpg\" alt=\"لوحة النظرة التنفيذية المنشورة باستخدام Power BI\" loading=\"lazy\" width=\"1363\" height=\"938\">\u003cspan>استكشف التقرير التفاعلي ←\u003c/span>\u003c/a>\n    \u003c/article>\n\n    \u003ch3 class=\"supporting-heading\">مشروعات أخرى وتطوير مستمر\u003c/h3>\n    \u003cdiv class=\"project-grid supporting-grid\">\n\u003carticle class=\"project-card reveal\">\u003cdiv class=\"project-meta\">\u003cspan class=\"badge active\">دراسة تعلّم منشورة\u003c/span>\u003cspan>Python · pandas · الانحدار\u003c/span>\u003c/div>\u003ch3>تحليل تركيب الأغذية ونمذجة السعرات\u003c/h3>\u003cp>تحليل 7,793 سجلًا غذائيًا ضمن 25 فئة، بدءًا من تنظيف وحدات العناصر الغذائية والتصور البياني وصولًا إلى ثلاث صيغ للانحدار الخطي.\u003c/p>\u003cp class=\"project-note\">نُشر العمل الأصلي على DataCamp في ديسمبر 2023. يتضمن مراجعة قابلة لإعادة التشغيل مع توضيح افتراضات النماذج وحدود التقييم.\u003c/p>\u003ca class=\"text-link\" href=\"nutrition-analysis-ar.html\">اقرأ التحليل الكامل والكود ←\u003c/a>\u003c/article>\n      \u003carticle class=\"project-card reveal\">\n        \u003cdiv class=\"project-meta\">\u003cspan class=\"badge archive\">قيد التطوير\u003c/span>\u003cspan>SQL Server · Python\u003c/span>\u003c/div>\n        \u003ch3>مستودع بيانات مؤسسي للصيدليات\u003c/h3>\n        \u003cp>أساس للتحليلات المؤسسية يدمج مصادر صيدلانية محاكاة عبر طبقات Bronze وSilver وGold.\u003c/p>\n        \u003cp class=\"project-note\">\u003cstrong>مرحلة الإنجاز الحالية:\u003c/strong> تحميل 72 جدولًا في طبقة Bronze تضم 60.2 مليون صف. يسبق التحقق والمطابقة مرحلتي Silver وGold وتقارير ذكاء الأعمال.\u003c/p>\n        \u003ca class=\"text-link\" href=\"https://github.com/shamseldeen/pharmacy-enterprise-data-warehouse\" target=\"_blank\" rel=\"noopener\">استكشف مستودع التطوير \u003cspan>↗\u003c/span>\u003c/a>\n      \u003c/article>\n\n\n      \u003carticle class=\"project-card reveal\">\n\n        \u003cdiv class=\"project-meta\">\n          \u003cspan class=\"badge active\">مشروع داعم · قيد التنفيذ\u003c/span>\n          \u003cspan>SQL · Python\u003c/span>\n        \u003c/div>\n\n        \u003ch3>منصة بيانات صيدلانية اصطناعية\u003c/h3>\n\n        \u003cp> بناء بيانات مصادر تحاكي سلسلة صيدليات كبيرة لتغذية مستودع البيانات واختباره عبر مجالات التشغيل المختلفة. \u003c/p>\n\n        \u003ca class=\"text-link\" href=\"https://github.com/shamseldeen/pharmacy-chain-data-platform-sql\" target=\"_blank\" rel=\"noopener\"> اطّلع على أعمال التطوير \u003cspan>↗\u003c/span>\n        \u003c/a>\n\n      \u003c/article>\n\n      \u003carticle class=\"project-card reveal\">\n\n        \u003cdiv class=\"project-meta\">\n          \u003cspan class=\"badge archive\">دراسة استكشافية\u003c/span>\n          \u003cspan>Python · تعلّم الآلة\u003c/span>\n        \u003c/div>\n\n        \u003ch3>استكشاف صور الأنسجة المرضية\u003c/h3>\n\n        \u003cp> دفتر تعلّم آلي مبكر يستكشف خصائص الصور وخفض الأبعاد باستخدام PCA والتصنيف باستخدام SVM على مجموعة بيانات UBC Ovarian Cancer. \u003c/p>\n\n        \u003cdiv class=\"card-links\">\n\n          \u003ca class=\"text-link\" href=\"https://github.com/shamseldeen/Ovarian-cancer\" target=\"_blank\" rel=\"noopener\">\n            GitHub \u003cspan>↗\u003c/span>\n          \u003c/a>\n\n          \u003ca class=\"text-link\" href=\"https://www.kaggle.com/code/shamseldeenismaiil/ovarian-cancer?scriptVersionId=147967849\" target=\"_blank\" rel=\"noopener\">\n            Kaggle \u003cspan>↗\u003c/span>\n          \u003c/a>\n\n        \u003c/div>\n\n      \u003c/article>\n\n    \u003c/div>\n\n  \u003c/section>\n\n  \u003csection class=\"section learning-home\" id=\"learning\">\u003cdiv class=\"section-label\">04 / التعلّم والتطبيق\u003c/div>\u003ch2>أساس موثق\u003cbr>في البيانات والتحليل.\u003c/h2>\u003cp class=\"lead\">يجمع سجل تعلّمي على DataCamp بين Python وSQL والإحصاء وتعلّم الآلة، مع روابط التحقق من الإنجاز وتحليل تطبيقي للأغذية.\u003c/p>\u003cdiv class=\"learning-stats\">\u003cdiv>\u003cstrong>74\u003c/strong>\u003cspan>كورسًا مكتملًا\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>7\u003c/strong>\u003cspan>مسارات مكتملة\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>25\u003c/strong>\u003cspan>سجل إتمام لمشروعات تدريبية\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>397,107\u003c/strong>\u003cspan>نقطة تعلّم XP\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"caption\">تم التحقق من النشاط في سبتمبر 2026. تتضمن سجلات التدريب نسخًا تاريخية لبعض المشروعات.\u003c/p>\u003ca class=\"button button-primary\" href=\"learning-ar.html\">استكشف رحلة التعلّم والمشروعات والشهادات ↗\u003c/a>\u003c/section>\n  \u003csection class=\"section\" id=\"experience\">\n\n    \u003cdiv class=\"section-label\">05 / الخبرة\u003c/div>\n\n    \u003cdiv class=\"experience-card reveal\">\n\n      \u003cdiv>\n\n        \u003cspan class=\"experience-date\">2015 — حتى الآن\u003c/span>\n\n        \u003ch2>صيدليات الدواء\u003c/h2>\n\n        \u003cp>صيدلي · عمليات صيدليات التجزئة\u003c/p>\n\n      \u003c/div>\n\n      \u003cul>\n        \u003cli> أكثر من 10 سنوات في عمليات الصيدليات ورعاية العملاء والمبيعات وإجراءات التأمين. \u003c/li>\n\n        \u003cli> أربع سنوات في أحد الفروع الرئيسية للشركة، مع المساهمة في المبيعات والأداء التشغيلي. \u003c/li>\n\n        \u003cli> معرفة عملية بمؤشرات التجزئة وسلوك العملاء وحركة المنتجات وسير العمل داخل الفروع. \u003c/li>\n\n        \u003cli> تطبيق التفكير المنظم والتحليل لمعالجة أسئلة الأعمال والتشغيل. \u003c/li>\n      \u003c/ul>\n\n    \u003c/div>\n\n    \u003cdiv class=\"education reveal\">\n\n      \u003cspan>التعليم\u003c/span>\n\n      \u003cstrong>جامعة الإسكندرية\u003c/strong>\n\n      \u003cp>بكالوري { gap: 8px; }\n  .site-header .brand-name { font-size: 20px; }\n  .site-header .brand-text small { font-size: 10px; }\n  .brand-symbol { width: 32px; height: 32px; }\n}\n\n@media (max-width: 360px) {\n  .site-header .brand { gap: 7px; }\n  .site-header .brand-name { font-size: 18px; }\n  .brand-symbol { width: 30px; height: 30px; }\n  .site-header > .language-switch svg { display: none; }\n}\n\u003c/style>\n\u003clink rel=\"icon\" type=\"image/svg+xml\" href=\"assets/brand/favicon.svg\">\n\u003c/head>\u003cbody>\u003ca class=\"skip-link\" href=\"#main\">انتقل إلى المحتوى\u003c/a>\u003cheader class=\"site-header\">\u003ca class=\"brand\" href=\"index-ar.html\">\u003cimg class=\"brand-symbol\" src=\"assets/brand/shams-insights-mark.svg\" width=\"40\" height=\"40\" alt=\"\" aria-hidden=\"true\" decoding=\"async\">\u003cspan class=\"brand-text\">\u003cspan class=\"brand-name\">شمس إنسايتس\u003c/span>\u003csmall>شمس الدين إسماعيل\u003c/small>\u003c/span>\u003c/a>\u003ca class=\"language-switch\" href=\"learning.html\" lang=\"en\" hreflang=\"en\" aria-label=\"الانتقال إلى الإنجليزية — English\" data-language-switch=\"\" dir=\"ltr\">\u003csvg viewbox=\"0 0 24 24\" width=\"18\" height=\"18\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\">\u003c/circle>\u003cellipse cx=\"12\" cy=\"12\" rx=\"4\" ry=\"9\">\u003c/ellipse>\u003cpath d=\"M3 12h18\">\u003c/path>\u003c/svg>\u003cspan>English\u003c/span>\u003c/a>\u003cbutton class=\"menu-button\" id=\"menuButton\" aria-controls=\"navigation\" aria-label=\"فتح القائمة\" aria-expanded=\"false\">\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003c/button>\u003cnav id=\"navigation\" aria-label=\"القائمة الرئيسية\">\u003ca href=\"index-ar.html#projects\">المشروعات\u003c/a>\u003ca href=\"learning-ar.html\">التعلّم\u003c/a>\u003ca href=\"nutrition-ar.html\">دراسة الأغذية\u003c/a>\u003ca class=\"nav-cta\" href=\"assets/Shamseldeen_Ismaiil_Data_Analyst_CV_AR.pdf\">تنزيل السيرة الذاتية\u003c/a>\u003c/nav>\u003c/header>\u003cmain id=\"main\">\u003csection class=\"learning-hero\">\u003cp class=\"eyebrow\">سجل التعلّم · تم التحقق في 23 سبتمبر 2026\u003c/p>\u003ch1>من التعلّم إلى\u003cbr>\u003cem>عمل يمكنك فحصه.\u003c/em>\u003c/h1>\u003cp class=\"lead\">تشمل رحلتي على DataCamp مهارات Python وSQL والإحصاء وتجهيز البيانات وتعلّم الآلة. يجمع هذا السجل التدريب المكتمل والتحليل الذي بنيته بتطبيق هذه المهارات.\u003c/p>\u003cdiv class=\"learning-stats\">\u003cdiv>\u003cstrong>74\u003c/strong>\u003cspan>كورسًا مكتملًا\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>7\u003c/strong>\u003cspan>مسارات مكتملة\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>25\u003c/strong>\u003cspan>سجل إتمام لمشروعات تدريبية\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>397,107\u003c/strong>\u003cspan>نقطة تعلّم XP\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"caption\">هذه إنجازات إتمام لكورسات ومسارات. تتضمن السجلات الـ25 نسخًا تاريخية لبعض الموضوعات؛ وهي مشروعات تدريبية وليست 25 نظامًا إنتاجيًا مستقلًا.\u003c/p>\u003cdiv class=\"quick-links\">\u003ca href=\"#public-projects\">المشروعات المفتوحة\u003c/a>\u003ca href=\"#journey\">رحلة التعلّم\u003c/a>\u003ca href=\"#tracks\">صور الشهادات\u003c/a>\u003ca href=\"#courses\">جميع الكورسات\u003c/a>\u003c/div>\u003c/section>\n\u003csection class=\"learning-section\" id=\"public-projects\">\u003cdiv class=\"section-label\">من التعلّم إلى التطبيق\u003c/div>\u003ch2>مشروعات متاحة للجميع.\u003c/h2>\u003cp class=\"section-intro\">افتح دراسات الحالة والنتائج مباشرة دون حساب. يمكنك أيضًا تنزيل الكود أو قراءة المستودعات العامة على GitHub.\u003c/p>\u003cdiv class=\"public-project-grid\">\u003carticle class=\"public-project\">\u003cspan class=\"access-badge\">بدون تسجيل دخول\u003c/span>\u003ch3>تركيب الأغذية ونمذجة السعرات\u003c/h3>\u003cp>7,793 سجلًا و25 فئة غذائية. تنظيف البيانات، والتحليل الاستكشافي، وثلاث صيغ انحدار، ومراجعة على بيانات اختبار منفصلة.\u003c/p>\u003ca class=\"text-link\" href=\"nutrition-ar.html\">اقرأ دراسة الحالة ←\u003c/a>\u003cdiv class=\"download-links\">\u003ca href=\"nutrition-analysis-ar.html\">اقرأ التحليل الكامل والكود داخل الموقع\u003c/a>\u003ca href=\"learning/nutrition/original_2023_reviewed.ipynb\" download>تنزيل دفتر 2023 المؤرشف\u003c/a>\u003ca href=\"learning/nutrition/reviewed_analysis.py\" download>تنزيل كود المراجعة\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"public-project\">\u003cspan class=\"access-badge\">بدون تسجيل دخول\u003c/span>\u003ch3>ذكاء الأعمال لتوزيع الأدوية\u003c/h3>\u003cp>تقرير Power BI من 6 صفحات، و150,000 سطر مبيعات اصطناعي، و70 تعريفًا بلغة DAX، مع دليل استخدام وقاموس مقاييس.\u003c/p>\u003ca class=\"text-link\" href=\"saudi-pharma-ar.html\">افتح دراسة الحالة والتقرير ←\u003c/a>\u003cp class=\"caption\">التقرير التفاعلي الأصلي بالإنجليزية؛ الشرح والإرشادات بالعربية.\u003c/p>\u003c/article>\u003c/div>\u003cp class=\"caption\">روابط مشروعات التدريب في كتالوج DataCamp أدناه قد تتطلب حسابًا أو اشتراكًا؛ وهي منفصلة عن دراسات الحالة العامة هنا.\u003c/p>\u003c/section>\u003csection class=\"learning-section\" id=\"journey\">\u003cdiv class=\"section-label\">محطات موثقة\u003c/div>\u003ch2>رحلة تتراكم فيها المهارات.\u003c/h2>\u003cp class=\"section-intro\">تعرض هذه المحطات التواريخ المثبتة في الشهادات والعمل المنشور، دون افتراض نشاط متواصل في الفترات غير الموثقة.\u003c/p>\u003col class=\"journey-timeline\">\u003cli>\u003ctime datetime=\"2023-07\">يوليو 2023\u003c/time>\u003cdiv>\u003ch3>pandas: تنظيم البيانات\u003c/h3>\u003cp>إتمام معالجة البيانات باستخدام pandas في 31 يوليو، ثم مواصلة بناء أساس Python.\u003c/p>\u003ca href=\"#cert-data-manipulation-pandas\">استكشف الدليل ←\u003c/a>\u003c/div>\u003c/li>\u003cli>\u003ctime datetime=\"2023-09\">سبتمبر – ديسمبر 2023\u003c/time>\u003cdiv>\u003ch3>SQL، وتعلّم الآلة، وتجهيز البيانات\u003c/h3>\u003cp>SQL للمستوى المتوسط في سبتمبر، وscikit-learn في أكتوبر، ومسار تنظيف البيانات في نوفمبر، ثم أساسيات الإحصاء في ديسمبر.\u003c/p>\u003ca href=\"#cert-intermediate-sql\">استكشف الدليل ←\u003c/a>\u003c/div>\u003c/li>\u003cli>\u003ctime datetime=\"2023-12\">ديسمبر 2023\u003c/time>\u003cdiv>\u003ch3>تطبيق على بيانات الأغذية\u003c/h3>\u003cp>نشر تحليل الأغذية في 11 ديسمبر: 7,793 سجلًا، وتصور بياني، ونماذج انحدار.\u003c/p>\u003ca href=\"nutrition-ar.html\">استكشف الدليل ←\u003c/a>\u003c/div>\u003c/li>\u003cli>\u003ctime datetime=\"2024-02\">فبراير – يوليو 2024\u003c/time>\u003cdiv>\u003ch3>توسيع المسارات وربط المهارات\u003c/h3>\u003cp>تصور البيانات في Power BI ومعالجة البيانات في فبراير، ومسار عالم البيانات في مارس، وأساسيات SQL في أبريل، ومحلل البيانات وأساسيات البيانات باستخدام Python في يوليو.\u003c/p>\u003ca href=\"#cert-data-analyst-python\">استكشف الدليل ←\u003c/a>\u003c/div>\u003c/li>\u003cli>\u003ctime datetime=\"2026-09\">سبتمبر 2026\u003c/time>\u003cdiv>\u003ch3>من سجل تدريب إلى بورتفوليو موثق\u003c/h3>\u003cp>مراجعة التحليل، وإتاحة الكود والنتائج، وربط 74 كورسًا و7 مسارات و25 سجل مشروع بالبورتفوليو. يستمر تطوير مستودع البيانات بصورة منفصلة.\u003c/p>\u003ca href=\"#public-projects\">استكشف الدليل ←\u003c/a>\u003c/div>\u003c/li>\u003c/ol>\u003c/section>\u003csection class=\"learning-section\" id=\"tracks\">\u003ca class=\"section-anchor\" href=\"#courses\">القائمة الكاملة للكورسات ↓\u003c/a>\u003cdiv class=\"section-label\">شهادات إتمام التعلّم\u003c/div>\u003ch2>سبعة مسارات مكتملة\u003c/h2>\u003cp class=\"section-intro\">تفتح روابط التحقق صفحات DataCamp الرسمية. توثق هذه الشهادات إتمام المسارات، وتختلف عن اجتياز اختبارات الاعتماد المهني لدى DataCamp.\u003c/p>\u003cdiv class=\"certificate-grid\">\u003carticle class=\"certificate-card\" id=\"cert-importing-cleaning-python\">\u003ca class=\"certificate-image\" href=\"assets/certificates/importing-cleaning-python.png\" target=\"_blank\" rel=\"noopener\" aria-label=\"عرض صورة شهادة استيراد البيانات وتنظيفها باستخدام Python\">\u003cimg src=\"assets/certificates/importing-cleaning-python.png\" alt=\"شهادة إتمام من DataCamp — استيراد البيانات وتنظيفها باستخدام Python — شمس الدين إسماعيل — dius:5px; background:var(--paper); }\n.study-methods strong { display:block; margin-bottom:.5rem; color:var(--green); }\n.study-methods p { margin:0; font-size:.92rem; }\nhtml[lang=ar] .food-study .study-methods { padding:0; }\nhtml[lang=ar] .food-study .food-finding strong { direction:ltr; text-align:right; }\nhtml[lang=ar] .food-study .study-note { border-radius:5px 0 0 5px; }\n@media(max-width:760px) {\n  .food-findings,.study-methods { grid-template-columns:1fr; }\n  .food-finding { padding:1.2rem; }\n  .food-finding strong { font-size:2rem; }\n  .food-study .learning-section { scroll-margin-top:95px; }\n  .food-study .learning-section h2 { font-size:clamp(1.8rem,6vw,2.6rem); }\n  .food-study .learning-hero h1 { font-size:clamp(2.3rem,8vw,3.4rem); }\n  .food-study .hero-actions .button { width:100%; }\n  .study-details-body { padding:1rem; }\n  .food-study pre { padding:1rem; font-size:.75rem; }\n  .food-study .study-contents a { font-size:.8rem; }\n}\n@media(prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } }\n\u003c/style>\u003c/head>\u003cbody class=\"food-study\">\u003ca class=\"skip-link\" href=\"#main\">انتقل إلى المحتوى\u003c/a>\u003cheader class=\"site-header\">\u003ca class=\"brand\" href=\"index-ar.html\">\u003cimg class=\"brand-symbol\" src=\"assets/brand/shams-insights-mark.svg\" width=\"40\" height=\"40\" alt=\"\" aria-hidden=\"true\" decoding=\"async\">\u003cspan class=\"brand-text\">\u003cspan class=\"brand-name\">شمس إنسايتس\u003c/span>\u003csmall>شمس الدين إسماعيل\u003c/small>\u003c/span>\u003c/a>\u003ca class=\"language-switch\" href=\"nutrition-analysis.html\" lang=\"en\" hreflang=\"en\" aria-label=\"الانتقال إلى الإنجليزية — English\" data-language-switch=\"\" dir=\"ltr\">\u003csvg viewbox=\"0 0 24 24\" width=\"18\" height=\"18\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\">\u003c/circle>\u003cellipse cx=\"12\" cy=\"12\" rx=\"4\" ry=\"9\">\u003c/ellipse>\u003cpath d=\"M3 12h18\">\u003c/path>\u003c/svg>\u003cspan>English\u003c/span>\u003c/a>\u003cbutton class=\"menu-button\" id=\"menuButton\" aria-controls=\"navigation\" aria-label=\"فتح القائمة\" aria-expanded=\"false\">\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003c/button>\u003cnav id=\"navigation\" aria-label=\"القائمة الرئيسية\">\u003ca href=\"index-ar.html#projects\">المشروعات\u003c/a>\u003ca href=\"learning-ar.html\">التعلّم\u003c/a>\u003ca href=\"nutrition-ar.html\">دراسة الأغذية\u003c/a>\u003ca class=\"nav-cta\" href=\"assets/Shamseldeen_Ismaiil_Data_Analyst_CV_AR.pdf\">تنزيل السيرة الذاتية\u003c/a>\u003c/nav>\u003c/header>\u003cmain id=\"main\">\n\u003csection class=\"learning-hero\">\n      \u003ca class=\"study-back\" href=\"nutrition-ar.html\">العودة إلى دراسة الحالة ←\u003c/a>\n      \u003cp class=\"eyebrow\">Python · التحليل الكامل · مراجعة سبتمبر 2026\u003c/p>\n      \u003ch1>تحليل الأغذية.\u003cbr>\u003cem>كل خطوة، في مكان واحد.\u003c/em>\u003c/h1>\n      \u003cp class=\"lead\">استكشف البيانات والنتائج، وافتح كود Python أثناء القراءة. تجمع هذه الصفحة مراجعة 2026 القابلة لإعادة التشغيل ودفتر 2023 المؤرشف داخل البورتفوليو.\u003c/p>\n      \u003cspan class=\"access-badge\">متاح للجميع · دون تسجيل دخول\u003c/span>\n      \u003cdiv class=\"learning-stats\">\u003cdiv>\u003cstrong>7,793\u003c/strong>\u003cspan>سجلًا غذائيًا\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>25\u003c/strong>\u003cspan>فئة غذائية\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>5,334\u003c/strong>\u003cspan>صفًا مؤهلًا للنمذجة\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>1,056\u003c/strong>\u003cspan>صفًا للاختبار المنفصل\u003c/span>\u003c/div>\u003c/div>\n      \u003cnav class=\"study-contents\" aria-label=\"فصول التحليل\">\n      \u003ca href=\"#data\">01 البيانات\u003c/a>\u003ca href=\"#cleaning\">02 التنظيف\u003c/a>\u003ca href=\"#exploration\">03 النتائج\u003c/a>\u003ca href=\"#models\">04 النماذج\u003c/a>\u003ca href=\"#code\">05 كود Python\u003c/a>\u003ca href=\"#original-notebook\">06 الدفتر الأصلي\u003c/a>\u003c/nav>\u003c/section>\n\u003csection class=\"learning-section\" id=\"data\">\u003cdiv class=\"section-label\">01 / البيانات\u003c/div>\u003ch2>غذاء واحد في كل صف، ومقارنة لكل 100 غرام.\u003c/h2>\u003cp class=\"section-intro\">عُدلت بيانات مسابقة DataCamp من USDA FoodData Central. تضم 12 عمودًا: معرّف الغذاء ووصفه وفئته وتسعة حقول للعناصر الغذائية أو الطاقة. أسماء الأغذية أدناه محفوظة كما وردت في المصدر.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003ccaption>أول خمسة صفوف من المصدر · القيم لكل 100 غرام\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">الغذاء\u003c/th>\u003cth scope=\"col\">الفئة\u003c/th>\u003cth scope=\"col\">الطاقة (كيلو سعر)\u003c/th>\u003cth scope=\"col\">الماء (غرام)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Pillsbury Golden Layer Buttermilk Biscuits, Artificial Flavor, refrigerated dough\u003c/td>\u003ctd>Baked Products\u003c/td>\u003ctd data-number=\"\">307.0\u003c/td>\u003ctd data-number=\"\">35.5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pillsbury, Cinnamon Rolls with Icing, refrigerated dough\u003c/td>\u003ctd>Baked Products\u003c/td>\u003ctd data-number=\"\">330.0\u003c/td>\u003ctd data-number=\"\">27.9\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Kraft Foods, Shake N Bake Original Recipe, Coating for Pork, dry\u003c/td>\u003ctd>Baked Products\u003c/td>\u003ctd data-number=\"\">377.0\u003c/td>\u003ctd data-number=\"\">3.2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>George Weston Bakeries, Thomas English Muffins\u003c/td>\u003ctd>Baked Products\u003c/td>\u003ctd data-number=\"\">232.0\u003c/td>\u003ctd data-number=\"\">42.6\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Waffles, buttermilk, frozen, ready-to-heat\u003c/td>\u003ctd>Baked Products\u003c/td>\u003ctd data-number=\"\">273.0\u003c/td>\u003ctd data-number=\"\">40.3\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdetails class=\"study-details\">\u003csummary>عرض أعداد الأغذية في الفئات الـ25\u003c/summary>\u003cdiv class=\"study-details-body\">\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">الفئة\u003c/th>\u003cth scope=\"col\">عدد الأغذية\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>American Indian/Alaska Native Foods\u003c/td>\u003ctd data-number=\"\">165\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Baby Foods\u003c/td>\u003ctd data-number=\"\">345\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Baked Products\u003c/td>\u003ctd data-number=\"\">517\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Beef Products\u003c/td>\u003ctd data-number=\"\">954\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Beverages\u003c/td>\u003ctd data-number=\"\">366\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Breakfast Cereals\u003c/td>\u003ctd data-number=\"\">195\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cereal Grains and Pasta\u003c/td>\u003ctd data-number=\"\">181\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Dairy and Egg Products\u003c/td>\u003ctd data-number=\"\">291\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fast Foods\u003c/td>\u003ctd data-number=\"\">312\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fats and Oils\u003c/td>\u003ctd data-number=\"\">216\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Finfish and Shellfish Products\u003c/td>\u003ctd data-number=\"\">264\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fruits and Fruit Juices\u003c/td>\u003ctd data-number=\"\">355\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lamb, Veal, and Game Products\u003c/td>\u003ctd data-number=\"\">464\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Legumes and Legume Products\u003c/td>\u003ctd data-number=\"\">290\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Meals, Entrees, and Side Dishes\u003c/td>\u003ctd data-number=\"\">81\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Nut and Seed Products\u003c/td>\u003ctd data-number=\"\">137\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pork Products\u003c/td>\u003ctd data-number=\"\">336\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Poultry Products\u003c/td>\u003ctd data-number=\"\">383\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Restaurant Foods\u003c/td>\u003ctd data-number=\"\">109\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sausages and Luncheon Meats\u003c/td>\u003ctd data-number=\"\">167\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Snacks\u003c/td>\u003ctd data-number=\"\">176\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Soups, Sauces, and Gravies\u003c/td>\u003ctd data-number=\"\">254\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Spices and Herbs\u003c/td>\u003ctd data-number=\"\">63\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sweets\u003c/td>\u003ctd data-number=\"\">358\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Vegetables and Vegetable Products\u003c/td>\u003ctd data-number=\"\">814\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\u003c/details>\n\u003cdiv class=\"source-downloads\">\u003ca href=\"learning/nutrition/nutrition.csv\" download>تنزيل البيانات (CSV)\u003c/a>\u003ca href=\"learning/nutrition/results/category_counts.csv\" download>تنزيل أعداد الفئات\u003c/a>\u003c/div>\u003c/section>\n\u003csection class=\"learning-section\" id=\"cleaning\">\u003cdiv class=\"section-label\">02 / التجهيز\u003c/div>\u003ch2>تحويل الوحدات مع الحفاظ على القيم المفقودة.\u003c/h2>\u003cp class=\"section-intro\">تُستخرج القيم الرقمية من نصوص مثل 5.88 g و307.0 kcal. تبقى القيم غير المسجلة مفقودة، وتختار كل عملية الأعمدة التي تحتاجها فقط، بدل حذف أي صف ينقصه أي حقل.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">الحقل\u003c/th>\u003cth scope=\"col\">صفوف بقيم مفقودة\u003c/th>\u003cth scope=\"col\">نسبتها من كل الأغذية\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>الكحول\u003c/td>\u003ctd data-number=\"\">2,394\u003c/td>\u003ctd data-number=\"\">30.7%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>الألياف\u003c/td>\u003ctd data-number=\"\">562\u003c/td>\u003ctd data-number=\"\">7.2%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>فيتامين C\u003c/td>\u003ctd data-number=\"\">461\u003c/td>\u003ctd data-number=\"\">5.9%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>الكوليسترول\u003c/td>\u003ctd data-number=\"\">399\u003c/td>\u003ctd data-number=\"\">5.1%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp class=\"caption\">لا توجد قيم مفقودة للسعرات أو البروتين أو الكربوهيدرات أو الدهون أو الماء في هذه البيانات.\u003c/p>\n\u003cdetails class=\"study-details\">\u003csummary>افتح كود التنظيف الفعلي\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>names={&#x27;Calories&#x27;:&#x27;calories&#x27;,&#x27;Protein&#x27;:&#x27;protein&#x27;,&#x27;Carbohydrate&#x27;:&#x27;carb&#x27;,&#x27;Total fat&#x27;:&#x27;fat&#x27;,&#x27;Cholesterol&#x27;:&#x27;cholesterol&#x27;,&#x27;Fiber&#x27;:&#x27;fiber&#x27;,&#x27;Water&#x27;:&#x27;water&#x27;,&#x27;Alcohol&#x27;:&#x27;alcohol&#x27;,&#x27;Vitamin C&#x27;:&#x27;vitamin_c&#x27;}\ndata=raw[[&#x27;FDC_ID&#x27;,&#x27;Item&#x27;,&#x27;Category&#x27;]].copy()\nfor src,dst in names.items():\n    data[dst]=pd.to_numeric(raw[src].astype(&#x27;string&#x27;).str.extract(r&#x27;^\\s*([-+]?\\d+(?:\\.\\d+)?)&#x27;,expand=False),errors=&#x27;coerce&#x27;)\n# Missing values stay missing; no unverified assumption that missing means zero.\nmissing=data[list(names.values())].isna().sum().to_dict()\u003c/code>\u003c/pre>\u003c/details>\n\u003c/section>\n\u003csection class=\"learning-section\" id=\"exploration\">\u003cdiv class=\"section-label\">03 / الاستكشاف\u003c/div>\u003ch2>ماذا تُظهر سجلات الأغذية؟\u003c/h2>\u003cdiv class=\"study-feature\">\u003cdiv>\u003ch3>ماء أكثر وكثافة طاقة أقل\u003c/h3>\u003cp>عبر 7,793 غذاءً، يبلغ معامل ارتباط بيرسون بين الماء والسعرات −0.895. يصف ذلك ارتباطًا عكسيًا قويًا داخل البيانات على أساس 100 غرام.\u003c/p>\u003c/div>\u003cfigure class=\"study-figure\">\u003cimg src=\"learning/nutrition/results/water-calories.png\" width=\"1600\" height=\"928\" loading=\"lazy\" alt=\"رسم مبعثر: ترتبط نسبة الماء الأعلى بسعرات أقل؛ معامل الارتباط سالب 0.895\">\u003cfigcaption>تتوفر قيم الماء والسعرات لجميع الصفوف. العلاقة وصفية بين خصائص الأغذية.\u003c/figcaption>\u003c/figure>\u003c/div>\n\u003ch3>أي الفواكه أعلى في فيتامين C ضمن هذه البيانات؟\u003c/h3>\u003cp class=\"section-intro\">تأتي الأسيرولا النيئة أولًا ضمن فئة الفواكه وعصائر الفواكه: 1,677.6 ملغ لكل 100 غرام. تتشارك الأغذية الطازجة والعصائر والمجففة أساس الكتلة نفسه، لكنها أشكال غذائية مختلفة.\u003c/p>\u003cfigure class=\"study-figure\">\u003cimg src=\"learning/nutrition/results/fruit-vitamin-c.svg\" width=\"1000\" height=\"490\" loading=\"lazy\" alt=\"أعلى خمسة سجلات للفواكه في فيتامين C؛ تتصدرها الأسيرولا النيئة وعصيرها\">\u003cfigcaption>*يحتفظ اسم العناب المختصر بوصف المصدر «طازج، مجفف». تظهر أسماء المصدر الكاملة والقيم الدقيقة أدناه.\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">اسم الغذاء في المصدر\u003c/th>\u003cth scope=\"col\">فيتامين C (ملغ / 100 غرام)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Acerola, (west indian cherry), raw\u003c/td>\u003ctd data-number=\"\">1,677.6\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Acerola juice, raw\u003c/td>\u003ctd data-number=\"\">1,600.0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Guavas, common, raw\u003c/td>\u003ctd data-number=\"\">228.3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Jujube, Chinese, fresh, dried\u003c/td>\u003ctd data-number=\"\">217.6\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Litchis, dried\u003c/td>\u003ctd data-number=\"\">183.0\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdetails class=\"study-details\">\u003csummary>استكشف سؤال المجموعات الغذائية الأصلي\u003c/summary>\u003cdiv class=\"study-details-body\">\u003cp>تعود هذه المقارنة إلى سؤال المجموعات الغذائية في الدفتر الأصلي. الغذاء الذي سُجلت له كربوهيدرات صفرية لا يمثل نظامًا غذائيًا كاملًا. المتوسطات غير مرجّحة بين السجلات، وتُستبعد قيم الكوليسترول المفقودة من متوسطه مع توضيح عدد القيم المتاحة.\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">المجموعة\u003c/th>\u003cth scope=\"col\">الصفوف\u003c/th>\u003cth scope=\"col\">متوسط السعرات\u003c/th>\u003cth scope=\"col\">متوسط الدهون (غ)\u003c/th>\u003cth scope=\"col\">متوسط الكوليسترول (ملغ)\u003c/th>\u003cth scope=\"col\">قيم الكوليسترول المتاحة\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>جميع الأغذية\u003c/td>\u003ctd data-number=\"\">7,793\u003c/td>\u003ctd data-number=\"\">220.2\u003c/td>\u003ctd data-number=\"\">10.7\u003c/td>\u003ctd data-number=\"\">45.0\u003c/td>\u003ctd data-number=\"\">7,394\u003c/td>\u003c/tr>\u003ctr>\u003ctd>الأغذية ذات الكربوهيدرات الصفرية\u003c/td>\u003ctd data-number=\"\">2,138\u003c/td>\u003ctd data-number=\"\">233.6\u003c/td>\u003ctd data-number=\"\">15.6\u003c/td>\u003ctd data-number=\"\">95.7\u003c/td>\u003ctd data-number=\"\">2,087\u003c/td>\u003c/tr>\u003ctr>\u003ctd>أعلى 500 غذاء في البروتين\u003c/td>\u003ctd data-number=\"\">500\u003c/td>\u003ctd data-number=\"\">242.7\u003c/td>\u003ctd data-number=\"\">9.7\u003c/td>\u003ctd data-number=\"\">99.6\u003c/td>\u003ctd data-number=\"\">493\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"caption\">جميع المتوسطات لكل 100 غرام. هذه مجموعات متداخلة واختيارات وصفية؛ لا تثبت فوائد أو أضرار الأنظمة الغذائية أو خطر الإصابة بالأمراض.\u003c/p>\u003ca class=\"text-link\" href=\"learning/nutrition/results/food_group_comparison.csv\" download>تنزيل المقارنة CSV\u003c/a>\u003c/div>\u003c/details>\n\u003c/section>\n\u003csection class=\"learning-section\" id=\"models\">\u003cdiv class=\"section-label\">04 / مقارنة النماذج\u003c/div>\u003ch2>تقييم كل نموذج على الأغذية نفسها.\u003c/h2>\u003cp class=\"section-intro\">يعطي النموذج الأصلي للعناصر الغذائية الكبرى، دون ثابت انحدار، معاملات 4.137 كيلو سعر/غ للبروتين و8.844 للدهون و3.854 للكربوهيدرات عند إعادة حسابه على جميع الصفوف ذات السعرات الموجبة. تستخدم المقارنة التالية عينة تقييم مشتركة منفصلة.\u003c/p>\u003col class=\"study-methods\">\u003cli>\u003cstrong>1. الصفوف المؤهلة نفسها\u003c/strong>\u003cp>5,334 غذاءً بسعرات موجبة وقيم مكتملة للبروتين والدهون والكربوهيدرات والكحول والألياف.\u003c/p>\u003c/li>\u003cli>\u003cstrong>2. تقسيم ثابت\u003c/strong>\u003cp>بذرة عشوائية 42 ونحو 20% من كل فئة للاختبار: 4,278 صفًا للتدريب و1,056 للاختبار.\u003c/p>\u003c/li>\u003cli>\u003cstrong>3. مقارنة أخطاء الاختبار\u003c/strong>\u003cp>تُقدّر المعاملات من صفوف التدريب فقط، ثم يُحسب MAE وRMSE على صفوف الاختبار نفسها للنماذج الثلاثة.\u003c/p>\u003c/li>\u003c/ol>\n\u003cfigure class=\"study-figure\">\u003cimg src=\"learning/nutrition/results/model-errors.svg\" width=\"1000\" height=\"490\" loading=\"lazy\" alt=\"خطأ RMSE في الاختبار: 15.38 للأساسي و15.71 لتفاعلات الفئات و13.55 للكحول والألياف، لكل 100 غرام\">\u003cfigcaption>تزيد تفاعلات الفئات وحدها RMSE قليلًا، بينما تقلله إضافة تفاعلات الكحول والألياف في هذا التقسيم.\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">صيغة النموذج\u003c/th>\u003cth scope=\"col\">MAE (kcal)\u003c/th>\u003cth scope=\"col\">RMSE (kcal)\u003c/th>\u003cth scope=\"col\">الرتبة / الأعمدة\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>العناصر الغذائية الكبرى\u003c/td>\u003ctd data-number=\"\">6.86\u003c/td>\u003ctd data-number=\"\">15.38\u003c/td>\u003ctd data-number=\"\">3 / 3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>تفاعلات الفئات\u003c/td>\u003ctd data-number=\"\">6.04\u003c/td>\u003ctd data-number=\"\">15.71\u003c/td>\u003ctd data-number=\"\">100 / 100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>تفاعلات الكحول والألياف\u003c/td>\u003ctd data-number=\"\">4.70\u003c/td>\u003ctd data-number=\"\">13.55\u003c/td>\u003ctd data-number=\"\">126 / 150\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp class=\"caption\">MAE هو متوسط الخطأ المطلق، وRMSE جذر متوسط مربع الخطأ. كلاهما بكيلو سعر حراري لكل 100 غرام. هذه نتائج مراجعة سبتمبر 2026، وليست نتائج التقديم الأصلي.\u003c/p>\u003cdiv class=\"study-note\">\u003cstrong>حدود تفسير النتيجة\u003c/strong>\u003cp>رتبة مصفوفة النموذج الأخير 126 من أصل 150 عمودًا، لذلك لا تتحدد المعاملات الفردية بصورة فريدة. قد توجد أغذية متشابهة في التدريب والاختبار، وقد يتحيز اختيار الحالات المكتملة. هذه مقارنة استكشافية داخلية، وليست تحققًا على مجتمع جديد أو أداة تنبؤ سريرية.\u003c/p>\u003c/div>\u003ca class=\"text-link\" href=\"learning/nutrition/results/model_comparison.csv\" download>تنزيل نتائج النماذج الدقيقة (CSV)\u003c/a>\u003c/section>\n\u003csection class=\"learning-section\" id=\"code\">\u003cdiv class=\"section-label\">05 / كود Python القابل لإعادة التشغيل\u003c/div>\u003ch2>اقرأ الكود الذي أنتج النتائج.\u003c/h2>\u003cp class=\"section-intro\">يتوفر سكربت المراجعة كاملًا أدناه. يستخدم pandas للتجهيز، والمربعات الصغرى في NumPy للنماذج، وMatplotlib للرسم المبعثر. يبقى الكود بالإنجليزية في النسختين.\u003c/p>\n\u003cdetails class=\"study-details\">\u003csummary>افتح سكربت المراجعة كاملًا\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>&quot;&quot;&quot;Reproducible 2026 review of Shamseldeen&#x27;s 2023 DataCamp nutrition study.\n\nRun: python reviewed_analysis.py --data nutrition.csv --output results\nThe original study used statsmodels. This companion uses NumPy least squares\nto make the specifications and common evaluation sample explicit.\n&quot;&quot;&quot;\nimport argparse,json\nfrom pathlib import Path\nimport numpy as np\nimport pandas as pd\nimport matplotlib\nmatplotlib.use(&#x27;Agg&#x27;)\nimport matplotlib.pyplot as plt\n\ndef main():\n    parser=argparse.ArgumentParser()\n    parser.add_argument(&#x27;--data&#x27;,default=&#x27;nutrition.csv&#x27;)\n    parser.add_argument(&#x27;--output&#x27;,default=&#x27;results&#x27;)\n    args=parser.parse_args()\n    out=Path(args.output);out.mkdir(parents=True,exist_ok=True)\n    raw=pd.read_csv(args.data)\n    names={&#x27;Calories&#x27;:&#x27;calories&#x27;,&#x27;Protein&#x27;:&#x27;protein&#x27;,&#x27;Carbohydrate&#x27;:&#x27;carb&#x27;,&#x27;Total fat&#x27;:&#x27;fat&#x27;,&#x27;Cholesterol&#x27;:&#x27;cholesterol&#x27;,&#x27;Fiber&#x27;:&#x27;fiber&#x27;,&#x27;Water&#x27;:&#x27;water&#x27;,&#x27;Alcohol&#x27;:&#x27;alcohol&#x27;,&#x27;Vitamin C&#x27;:&#x27;vitamin_c&#x27;}\n    data=raw[[&#x27;FDC_ID&#x27;,&#x27;Item&#x27;,&#x27;Category&#x27;]].copy()\n    for src,dst in names.items():\n        data[dst]=pd.to_numeric(raw[src].astype(&#x27;string&#x27;).str.extract(r&#x27;^\\s*([-+]?\\d+(?:\\.\\d+)?)&#x27;,expand=False),errors=&#x27;coerce&#x27;)\n    # Missing values stay missing; no unverified assumption that missing means zero.\n    missing=data[list(names.values())].isna().sum().to_dict()\n    sample=data.dropna(subset=[&#x27;calories&#x27;,&#x27;protein&#x27;,&#x27;fat&#x27;,&#x27;carb&#x27;,&#x27;alcohol&#x27;,&#x27;fiber&#x27;]).copy()\n    sample=sample.loc[sample.calories&gt;0].reset_index(drop=True)\n    # Same rows and deterministic split across all models, stratified by food category.\n    rng=np.random.default_rng(42);test_idx=[]\n    for _,group in sample.groupby(&#x27;Category&#x27;,sort=True):\n        ids=group.index.to_numpy();rng.shuffle(ids)\n        if len(ids)&gt;=5:test_idx.extend(ids[:max(1,int(len(ids)*.2))])\n    test=np.zeros(len(sample),dtype=bool);test[test_idx]=True;train=~test\n    categories=pd.get_dummies(sample.Category,dtype=float).to_numpy()\n    def matrix(cols,interactions):\n        x=sample[cols].to_numpy(dtype=float)\n        return np.column_stack([categories]+[categories*x[:,j,None] for j in range(x.shape[1])]) if interactions else x\n    specs=[(&#x27;Macronutrients&#x27;,[&#x27;protein&#x27;,&#x27;fat&#x27;,&#x27;carb&#x27;],False),(&#x27;Category interactions&#x27;,[&#x27;protein&#x27;,&#x27;fat&#x27;,&#x27;carb&#x27;],True),(&#x27;Alcohol and fiber interactions&#x27;,[&#x27;protein&#x27;,&#x27;fat&#x27;,&#x27;carb&#x27;,&#x27;alcohol&#x27;,&#x27;fiber&#x27;],True)]\n    metrics=[];y=sample.calories.to_numpy(dtype=float)\n    for label,cols,interactions in specs:\n        x=matrix(cols,interactions);beta,_,rank,_=np.linalg.lstsq(x[train],y[train],rcond=None)\n        pred=x@beta\n        err=pred[test]-y[test]\n        metrics.append({&#x27;model&#x27;:label,&#x27;train_rows&#x27;:int(train.sum()),&#x27;test_rows&#x27;:int(test.sum()),&#x27;parameters&#x27;:x.shape[1],&#x27;rank&#x27;:int(rank),&#x27;test_mae_kcal&#x27;:float(np.abs(err).mean()),&#x27;test_rmse_kcal&#x27;:float(np.sqrt(np.mean(err**2))),&#x27;test_r2&#x27;:float(1-np.sum(err**2)/np.sum((y[test]-y[test].mean())**2))})\n    # Reproduce the saved original baseline using all positive-calorie records.\n    baseline=data.loc[data.calories&gt;0].dropna(subset=[&#x27;protein&#x27;,&#x27;fat&#x27;,&#x27;carb&#x27;])\n    coeff=np.linalg.lstsq(baseline[[&#x27;protein&#x27;,&#x27;fat&#x27;,&#x27;carb&#x27;]].to_numpy(dtype=float),baseline.calories.to_numpy(dtype=float),rcond=None)[0]\n    correlation=float(data[[&#x27;water&#x27;,&#x27;calories&#x27;]].corr().iloc[0,1])\n    fruits=data[data.Category==&#x27;Fruits and Fruit Juices&#x27;].dropna(subset=[&#x27;vitamin_c&#x27;]).nlargest(5,&#x27;vitamin_c&#x27;)\n    result={&#x27;reviewDate&#x27;:&#x27;2026-09-23&#x27;,&#x27;originalPublicationDate&#x27;:&#x27;2023-12-11&#x27;,&#x27;rows&#x27;:len(raw),&#x27;categories&#x27;:int(raw.Category.nunique()),&#x27;completeAllOriginalColumns&#x27;:int(raw.dropna().shape[0]),&#x27;missing&#x27;:{k:int(v) for k,v in missing.items()},&#x27;modelSampleRows&#x27;:len(sample),&#x27;waterCaloriesPearsonR&#x27;:correlation,&#x27;baselineCoefficients&#x27;:dict(zip([&#x27;protein&#x27;,&#x27;fat&#x27;,&#x27;carb&#x27;],map(float,coeff))),&#x27;topFruitVitaminC&#x27;:fruits[[&#x27;Item&#x27;,&#x27;vitamin_c&#x27;]].to_dict(&#x27;records&#x27;),&#x27;models&#x27;:metrics,&#x27;limitations&#x27;:[&#x27;A random row split is an internal check, not validation on a new population. Similar products can occur across the split.&#x27;,&#x27;Complete-case sampling can be biased; missing alcohol values are common.&#x27;,&#x27;Category-interaction models can be rank deficient; least squares provides one minimum-norm solution.&#x27;,&#x27;Energy is closely related to nutrient quantities by construction. High R-squared is not clinical evidence.&#x27;,&#x27;This descriptive food-composition study cannot infer health outcomes or recommend diets.&#x27;]}\n    (out/&#x27;metrics.json&#x27;).write_text(json.dumps(result,indent=2))\n    pd.DataFrame(metrics).to_csv(out/&#x27;model_comparison.csv&#x27;,index=False)\n    plt.rcParams.update({&#x27;font.family&#x27;:&#x27;DejaVu Sans&#x27;,&#x27;axes.spines.top&#x27;:False,&#x27;axes.spines.right&#x27;:False,&#x27;axes.labelcolor&#x27;:&#x27;#10231e&#x27;,&#x27;text.color&#x27;:&#x27;#10231e&#x27;})\n    fig,ax=plt.subplots(figsize=(10,5.8),layout=&#x27;constrained&#x27;);fig.patch.set_facecolor(&#x27;#f6f3eb&#x27;);ax.set_facecolor(&#x27;#f6f3eb&#x27;)\n    ax.scatter(data.water,data.calories,s=7,alpha=.18,color=&#x27;#176b52&#x27;,edgecolors=&#x27;none&#x27;,rasterized=True)\n    ax.set(xlabel=&#x27;Water (g per 100 g food)&#x27;,ylabel=&#x27;Energy (kcal per 100 g food)&#x27;,title=&#x27;Water content and energy density&#x27;)\n    ax.text(.98,.96,f&#x27;7,793 food records · r = {correlation:.2f}&#x27;,ha=&#x27;right&#x27;,va=&#x27;top&#x27;,transform=ax.transAxes)\n    fig.savefig(out/&#x27;water-calories.png&#x27;,dpi=160);plt.close(fig)\n    print(json.dumps(result,indent=2))\n\nif __name__==&#x27;__main__&#x27;:main()\n\u003c/code>\u003c/pre>\u003c/details>\n\u003cdetails class=\"study-details\">\u003csummary>تشغيل التحليل محليًا\u003c/summary>\u003cdiv class=\"study-details-body\">\u003cp>انسخ المستودع وشغّل هذه الأوامر من مجلد learning/nutrition. يعيد الأمر الأخير بناء جداول الويب والرسوم الإضافية وصفحتي التحليل الكامل.\u003c/p>\u003cpre tabindex=\"0\">\u003ccode>python -m pip install -r requirements.txt\npython reviewed_analysis.py --data nutrition.csv --output results\npython build_web_analysis.py\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\u003cdiv class=\"source-downloads\">\u003ca href=\"learning/nutrition/reviewed_analysis.py\" download>سكربت المراجعة (.py)\u003c/a>\u003ca href=\"learning/nutrition/build_web_analysis.py\" download>كود جداول الويب والرسوم (.py)\u003c/a>\u003ca href=\"learning/nutrition/requirements.txt\" download>متطلبات Python\u003c/a>\u003ca href=\"https://github.com/shamseldeen/Shamseldeen.github.io/tree/main/learning/nutrition\" target=\"_blank\" rel=\"noopener\">GitHub ↗\u003c/a>\u003c/div>\u003c/section>\n\u003csection class=\"learning-section\" id=\"original-notebook\">\u003cdiv class=\"section-label\">06 / العمل الأصلي\u003c/div>\u003ch2>اقرأ دفتر 2023 المؤرشف.\u003c/h2>\u003cp class=\"section-intro\">تظهر أدناه جميع خلايا الأرشيف العام البالغ عددها 99 خلية بلغتها الإنجليزية الأصلية. يحتفظ الأرشيف بالكود التاريخي، مع حذف المخرجات المحفوظة وتعديل عبارة واحدة غير مدعومة عن النتائج الصحية. لم يُعَد تشغيل هذا الدفتر؛ النتائج أعلاه تخص مراجعة 2026 المنفصلة.\u003c/p>\u003cp class=\"caption\">تعويض القيم المفقودة بصفر ومقارنات التدريب وشبكات التنبؤ الافتراضية خطوات تعلّم تاريخية. شُرحت المنهجية المُراجعة وحدودها أعلاه.\u003c/p>\n\u003cdetails class=\"study-details\">\u003csummary>قراءة جميع الخلايا المؤرشفة الـ99 · بالإنجليزية\u003c/summary>\u003cdiv class=\"study-details-body\">\u003cdiv class=\"archive-cell\" data-cell=\"1\">\u003cspan class=\"archive-cell-label\" dir=\"ltr\">Cell 01 / 99 · markdown\u003c/span>\u003cdiv class=\"archive-text\" lang=\"en\" dir=\"ltr\">\u003ch4>Archived 2023 nutrition analysis\u003c/h4>\nAuthor: Shamseldeen Ismaiil. Original publication: 11 December 2023.\n\nPortfolio archive prepared 23 September 2026. Original code is preserved; stored outputs are removed for portability and one unsupported health-outcome statement is replaced by a descriptive limitation. This historical notebook has not been rerun.\n\nKnown issues include missing-value zero imputation, a mismatch between the described and actual final modeling frame, in-sample model comparison, and extrapolation to impossible nutrient combinations. Read README.md and use reviewed_analysis.py for the reproducible 2026 review.\u003c/div>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"2\">\u003cspan class=\"archive-cell-label\" dir=\"ltr\">Cell 02 / 99 · markdown\u003c/span>\u003cdiv class=\"archive-text\" lang=\"en\" dir=\"ltr\">\u003ch4>What is good food?\u003c/h4>\n\n\u003ch4>📖 Background\u003c/h4>\nYou and your friend have gotten into a debate about nutrition. Your friend follows a high-protein diet and does not eat any carbohydrates (no grains, no fruits). You claim that a balanced diet should contain all nutrients but should be low in calories. Both of you quickly realize that most of what you know about nutrition comes from mainstream and social media.\n\nBeing the data scientist that you are, you offer to look at the data yourself to answer a few key questions.\u003c/div>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"3\">\u003cspan class=\"archive-cell-label\" dir=\"ltr\">Cell 03 / 99 · markdown\u003c/span>\u003cdiv class=\"archive-text\" lang=\"en\" dir=\"ltr\">\u003ch4>💾 The data\u003c/h4>\n\nYou source nutrition data from USDA&#x27;s FoodData Central \u003ca href=\"https://fdc.nal.usda.gov/download-datasets.html\" target=\"_blank\" rel=\"noopener\">website\u003c/a>. This data contains the calorie content of 7,793 common foods, as well as their nutritional composition. Each row represents one food item, and nutritional values are based on a 100g serving. Here is a description of the columns:\n\n- \u003cstrong>FDC_ID\u003c/strong>: A unique identifier for each food item in the database.\n- \u003cstrong>Item\u003c/strong>: The name or description of the food product.\n- \u003cstrong>Category\u003c/strong>: The category or classification of the food item, such as &quot;Baked Products&quot; or &quot;Vegetables and Vegetable Products&quot;.\n- \u003cstrong>Calories\u003c/strong>: The energy content of the food, presented in kilocalories (kcal).\n- \u003cstrong>Protein\u003c/strong>: The protein content of the food, measured in grams.\n- \u003cstrong>Carbohydrate\u003c/strong>: The carbohydrate content of the food, measured in grams.\n- \u003cstrong>Total fat\u003c/strong>: The total fat content of the food, measured in grams.\n- \u003cstrong>Cholesterol\u003c/strong>: The cholesterol content of the food, measured in milligrams.\n- \u003cstrong>Fiber\u003c/strong>: The dietary fiber content of the food, measured in grams.\n- \u003cstrong>Water\u003c/strong>: The water content of the food, measured in grams.\n- \u003cstrong>Alcohol\u003c/strong>: The alcohol content of the food (if any), measured in grams.\n- \u003cstrong>Vitamin C\u003c/strong>: The Vitamin C content of the food, measured in milligrams.\u003c/div>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"4\">\u003cdetails class=\"study-details\">\u003csummary>Cell 04 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>import pandas as pd\ndf_food = pd.read_csv(&#x27;nutrition.csv&#x27;)\n\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"5\">\u003cspan class=\"archive-cell-label\" dir=\"ltr\">Cell 05 / 99 · markdown\u003c/span>\u003cdiv class=\"archive-text\" lang=\"en\" dir=\"ltr\">\u003ch4>summary:\u003c/h4>\n\nCreate a report that covers the following:\n\n1. fruit has the highest vitamin C and  some other sources of vitamin C.\n2. the relationship between the calories and water content \n3. possible drawbacks of a zero-carb diet drawbacks of a very high-protein diet.\n4. fit a linear model to find that kcal in protein, carbohydrates and fat.\n5. Alcohol as a source of calories.\u003c/div>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"6\">\u003cspan class=\"archive-cell-label\" dir=\"ltr\">Cell 06 / 99 · markdown\u003c/span>\u003cdiv class=\"archive-text\" lang=\"en\" dir=\"ltr\">🥇First of all we need to explore our data and see information about dataframe.\nInformation of Food data and columns types.\u003c/div>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"7\">\u003cdetails class=\"study-details\">\u003csummary>Cell 07 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>df_food.info()\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"8\">\u003cspan class=\"archive-cell-label\" dir=\"ltr\">Cell 08 / 99 · markdown\u003c/span>\u003cdiv class=\"archive-text\" lang=\"en\" dir=\"ltr\">Delete all missing Data.\nNew Data information.\u003c/div>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"9\">\u003cdetails class=\"study-details\">\u003csummary>Cell 09 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>df_food_Nna = df_food.dropna()\ndf_food_Nna.info()\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"10\">\u003cspan class=\"archive-cell-label\" dir=\"ltr\">Cell 10 / 99 · markdown\u003c/span>\u003cdiv class=\"archive-text\" lang=\"en\" dir=\"ltr\">All columns are object but we need to convert all columns with data of object types and all data in it to numbers,so we can process this data.\u003c/div>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"11\">\u003cdetails class=\"study-details\">\u003csummary>Cell 11 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>import numpy as np\ndf_food[[&#x27;Vitamin C&#x27;,&#x27;Cholesterol&#x27;]] = df_food[[&#x27;Vitamin C&#x27;,&#x27;Cholesterol&#x27;]].fillna(&#x27;0.0 mg&#x27;)\ndf_food[[&#x27;Fiber&#x27;,&#x27;Alcohol&#x27;]]= df_food[[&#x27;Fiber&#x27;,&#x27;Alcohol&#x27;]].fillna(&#x27;0.0 g&#x27;)\n\n\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"12\">\u003cspan class=\"archive-cell-label\" dir=\"ltr\">Cell 12 / 99 · markdown\u003c/span>\u003cdiv class=\"archive-text\" lang=\"en\" dir=\"ltr\">We need all data, so we replace missing data with 0, as start to begin aur journey.🌋\u003c/div>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"13\">\u003cdetails class=\"study-details\">\u003csummary>Cell 13 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>def DataframeAddCol(df, dic):\n    &quot;&quot;&quot;\n    Function to convert string columns with &#x27;mg, g, kca, ...&#x27; to float and add new columns to the dataframe.\n    df: DataFrame, dic: dictionary of column names and measurements like mg, g, ...\n    &quot;&quot;&quot;\n    for i, x in dic.items():\n        new_col_name = i + &quot;_&quot; + x\n        df[new_col_name] = pd.to_numeric(df[i].str.split(x).str[0], errors=&#x27;coerce&#x27;)\n    return df\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"14\">\u003cspan class=\"archive-cell-label\" dir=\"ltr\">Cell 14 / 99 · markdown\u003c/span>\u003cdiv class=\"archive-text\" lang=\"en\" dir=\"ltr\">Our first step convert all columns with data from objects to numbers.🪜\u003c/div>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"15\">\u003cdetails class=\"study-details\">\u003csummary>Cell 15 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>dictcol = {&quot;Calories&quot;:&quot;kcal&quot;,\n          &quot;Protein&quot;:&quot;g&quot;,\n          &quot;Carbohydrate&quot;:&quot;g&quot;,\n          &quot;Total fat&quot;:&quot;g&quot;,\n          &quot;Cholesterol&quot;:&quot;mg&quot;,\n          &quot;Fiber&quot;:&quot;g&quot;,\n          &quot;Water&quot;:&quot;g&quot;,\n          &quot;Alcohol&quot;:&quot;g&quot;,\n          &quot;Vitamin C&quot;:&quot;mg&quot;}\nDataframeAddCol(df_food,dictcol)\n\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"16\">\u003cspan class=\"archive-cell-label\" dir=\"ltr\">Cell 16 / 99 · markdown\u003c/span>\u003cdiv class=\"archive-text\" lang=\"en\" dir=\"ltr\">Now📝, we have our new dataframe with numerical columns from originals.\u003c/div>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"17\">\u003cdetails class=\"study-details\">\u003csummary>Cell 17 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>print(df_food.info())\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"18\">\u003cspan class=\"archive-cell-label\" dir=\"ltr\">Cell 18 / 99 · markdown\u003c/span>\u003cdiv class=\"archive-text\" lang=\"en\" dir=\"ltr\">New Dataframe with new numerical columns.\u003c/div>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"19\">\u003cdetails class=\"study-details\">\u003csummary>Cell 19 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>\ndf_food_No = df_food[[&#x27;FDC_ID&#x27;,&#x27;Item&#x27;,&#x27;Category&#x27;,&#x27;Calories_kcal&#x27;,\n              &#x27;Protein_g&#x27;,\n              &#x27;Carbohydrate_g&#x27;,\n              &#x27;Total fat_g&#x27;,\n              &#x27;Cholesterol_mg&#x27;,\n              &#x27;Fiber_g&#x27;,\n              &#x27;Water_g&#x27;,\n              &#x27;Alcohol_g&#x27;,\n              &#x27;Vitamin C_mg&#x27;]]\n\n\ndf_food_No.info()\n               \n\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"20\">\u003cspan class=\"archive-cell-label\" dir=\"ltr\">Cell 20 / 99 · markdown\u003c/span>\u003cdiv class=\"archive-text\" lang=\"en\" dir=\"ltr\">what is the highest vitamin C food and it&#x27;s other properties?⁉️\u003c/div>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"21\">\u003cdetails class=\"study-details\">\u003csummary>Cell 21 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>highCfood = df_food_No[df_food[&#x27;Vitamin C_mg&#x27;] == df_food[&#x27;Vitamin C_mg&#x27;].max()]\n\n\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"22\">\u003cdetails class=\"study-details\">\u003csummary>Cell 22 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>highCfood\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"23\">\u003cspan class=\"archive-cell-label\" dir=\"ltr\">Cell 23 / 99 · markdown\u003c/span>\u003cdiv class=\"archive-text\" lang=\"en\" dir=\"ltr\">Which fruit has the highest vitamin C content? \n🥗🥝🍊🍏🍓🍊\nWhat are some other sources of vitamin C?\n🍉🍈🍇🍅🍄🌭🌮🌯🌽🌾\n\u003c/div>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"24\">\u003cdetails class=\"study-details\">\u003csummary>Cell 24 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>df_foodFruit = df_food[df_food[&#x27;Category&#x27;].isin([&#x27;Fruits and Fruit Juices&#x27;])]\ndf_foodFruit_HvitC = df_foodFruit[df_foodFruit[&#x27;Vitamin C_mg&#x27;] == df_foodFruit[&#x27;Vitamin C_mg&#x27;].max()]\nitemFruitHC = list(df_foodFruit_HvitC[&#x27;Item&#x27;])\nConcVitC = df_foodFruit_HvitC[&#x27;Vitamin C_mg&#x27;]\n\nprint(f&quot;Now,the fruit has the heighest vitamin C content,This fruit is named &#x27;{itemFruitHC[0].split(&#x27;,&#x27;)[0]}&#x27; and it has a concentration of vitamin C equal {int(ConcVitC)} mg.&quot;)\n\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"25\">\u003cdetails class=\"study-details\">\u003csummary>Cell 25 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>import seaborn as sns\nimport matplotlib.pyplot as plt\ndf_food_No[&#x27;Vitamin_C_mg&#x27;] = df_food_No[&#x27;Vitamin C_mg&#x27;]\nConcVitC = float(ConcVitC)\n\ndf_food_No[&#x27;point_type&#x27;] = [&#x27;Highest vitC Fruit &quot;Acerola&quot;&#x27; if VitC == ConcVitC else &#x27;Others&#x27; for VitC in df_food_No.Vitamin_C_mg]\nsns.scatterplot(x = &#x27;Vitamin_C_mg&#x27;,\n                y = &#x27;Water_g&#x27;,\n                hue = &#x27;point_type&#x27;,\n                data = df_food_No)\nplt.show()\n\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"26\">\u003cspan class=\"archive-cell-label\" dir=\"ltr\">Cell 26 / 99 · markdown\u003c/span>\u003cdiv class=\"archive-text\" lang=\"en\" dir=\"ltr\">Other food with high concentration of Vitamin C.\u003c/div>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"27\">\u003cdetails class=\"study-details\">\u003csummary>Cell 27 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>\ndef highconc(column1,colNam=&#x27;Vitamin C_mg&#x27;,df0=df_food):\n    &quot;&quot;&quot;\n    column1 is category of item\n    column2 is numeric to take max\n    take the max vitamin c in each item in column \n    return all dataframe columns\n    but only unique item of selected column\n    &quot;&quot;&quot;\n    listcolumn1 = list(column1.unique())\n    df = pd.DataFrame()\n    for i in listcolumn1:\n        df1 = df0[column1.isin([i])]\n        \n        df2 = df1[df1[colNam] == df1[colNam].max()]\n        df = pd.concat([df2, df], ignore_index=True)\n        \n    return df \u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"28\">\u003cdetails class=\"study-details\">\u003csummary>Cell 28 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>\ndfhighC = highconc(df_food_No[&#x27;Category&#x27;],df0=df_food_No)\n\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"29\">\u003cdetails class=\"study-details\">\u003csummary>Cell 29 / 99 · code\u003c/summary>\u003cpre class=\"source-code\" tabindex=\"0\">\u003ccode>\ndfhighC.drop(index=18,axis=0,inplace=True)\n\u003c/code>\u003c/pre>\u003c/details>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"30\">\u003cspan class=\"archive-cell-label\" dir=\"ltr\">Cell 30 / 99 · markdown\u003c/span>\u003cdiv class=\"archive-text\" lang=\"en\" dir=\"ltr\">The heighest vitamin C foods Dataframe in food Database.\u003c/div>\u003c/div>\u003cdiv class=\"archive-cell\" data-cell=\"31\">\u003cdetails class=\"study-d
