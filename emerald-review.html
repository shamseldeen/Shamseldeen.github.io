<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Temporary emerald review</title>
<style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#edf1f3;color:#102a43;font:14px/1.5 system-ui}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:17px;margin:0}select{font:inherit;padding:6px}#status{margin:8px 0;max-width:1100px}iframe{display:block;height:790px;border:1px solid #b6c2c8}</style></head>
<body><header><h1>Emerald review</h1><label>Page <select id="page"><option value="index-ar.html">Arabic home</option><option value="index.html">English home</option><option value="saudi-pharma-ar.html">Arabic Power BI</option><option value="learning.html">English learning</option></select></label><label>Width <select id="width"><option>320</option><option selected>390</option><option>850</option><option>1366</option></select></label></header><p id="status">Loading</p><iframe id="preview" title="Responsive emerald preview"></iframe>
<script>
const preview=document.querySelector('#preview'),page=document.querySelector('#page'),width=document.querySelector('#width'),status=document.querySelector('#status');
function measure(){const d=preview.contentDocument,w=preview.contentWindow,h=d.querySelector('.site-header'),brand=h.querySelector('.brand'),initial=h.querySelector('.brand-initial'),button=d.querySelector('.button-primary'),rects=[...h.querySelectorAll('.brand,.language-switch,.menu-button')].filter(e=>w.getComputedStyle(e).display!=='none').map(e=>e.getBoundingClientRect());let overlaps=false;for(let i=0;i<rects.length;i++)for(let j=i+1;j<rects.length;j++)if(Math.min(rects[i].right,rects[j].right)-Math.max(rects[i].left,rects[j].left)>1&&Math.min(rects[i].bottom,rects[j].bottom)-Math.max(rects[i].top,rects[j].top)>1)overlaps=true;status.textContent=JSON.stringify({page:page.value,width:w.innerWidth,name:brand.querySelector('.brand-name').textContent,initial:initial?initial.textContent:null,initialColor:initial?w.getComputedStyle(initial).color:null,buttonColor:button?w.getComputedStyle(button).backgroundColor:null,headerOverlap:overlaps,overflow:d.documentElement.scrollWidth-d.documentElement.clientWidth});}
function resize(){preview.style.width=(Number(width.value)+2)+'px';requestAnimationFrame(()=>requestAnimationFrame(measure));}
preview.onload=async()=>{await preview.contentDocument.fonts.ready;resize();};
page.addEventListener('change',()=>{status.textContent='Loading';preview.src=page.value+'?review=emerald1';});width.addEventListener('change',resize);preview.style.width=(Number(width.value)+2)+'px';preview.src='index-ar.html?review=emerald1';
</script></body></html>
