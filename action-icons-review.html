<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Temporary action icon review</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#edf1f3;color:#102a43;font:14px/1.5 system-ui}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:17px;margin:0}select{font:inherit;padding:6px}#status{max-width:1250px;margin:8px 0}iframe{display:block;height:790px;border:1px solid #b6c2c8}</style></head><body><header><h1>Action icon review</h1><label>Page <select id="page"><option value="index-ar.html">Arabic</option><option value="index.html">English</option></select></label><label>Width <select id="width"><option>320</option><option selected>390</option><option>1366</option></select></label></header><p id="status">Loading</p><iframe id="preview" title="Responsive action icon preview"></iframe><script>
const frame=document.querySelector('#preview'),page=document.querySelector('#page'),width=document.querySelector('#width'),status=document.querySelector('#status');
function measure(){const d=frame.contentDocument,w=frame.contentWindow,buttons=[...d.querySelectorAll('.button-with-icon')];status.textContent=JSON.stringify({page:page.value,width:w.innerWidth,overflow:d.documentElement.scrollWidth-d.documentElement.clientWidth,buttons:buttons.map(a=>{const s=a.querySelector('svg'),t=a.querySelector('span'),r=a.getBoundingClientRect(),i=s.getBoundingClientRect(),l=t.getBoundingClientRect();return {label:a.textContent.trim(),height:r.height,iconWidth:i.width,color:w.getComputedStyle(s).color,iconHidden:s.getAttribute('aria-hidden'),iconBeforeText:d.documentElement.dir==='rtl'?i.left>=l.right:i.right<=l.left,href:a.getAttribute('href')};})});}
function resize(){frame.style.width=(Number(width.value)+2)+'px';requestAnimationFrame(()=>requestAnimationFrame(measure));}frame.onload=async()=>{await frame.contentDocument.fonts.ready;resize();};page.addEventListener('change',()=>{status.textContent='Loading';frame.src=page.value+'?review=action-icons1';});width.addEventListener('change',resize);frame.style.width=(Number(width.value)+2)+'px';frame.src='index-ar.html?review=action-icons1';
</script></body></html>
