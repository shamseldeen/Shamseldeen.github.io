<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Temporary Shams Insights responsive check</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#edf1f3;color:#102a43;font:15px/1.5 system-ui,sans-serif}header{display:flex;flex-wrap:wrap;gap:24px;align-items:center;margin-bottom:16px}h1{font-size:17px;margin:0}label{display:flex;align-items:center;gap:8px}select{font:inherit;padding:6px}main{display:flex;gap:24px;align-items:flex-start;width:max-content}figure{margin:0}figcaption{margin-bottom:8px;font-weight:600}iframe{display:block;width:390px;height:800px;border:1px solid #bdc9cf;background:#f6f3eb}
</style>
</head>
<body>
<header>
<h1>Responsive brand check</h1>
<label>Viewport width <select id="width"><option>320</option><option>360</option><option selected>390</option><option>768</option><option>850</option><option>851</option><option>1024</option><option>1366</option></select></label>
<label>Page <select id="page"><option value="index">Home</option><option value="learning">Learning</option><option value="nutrition">Nutrition</option><option value="saudi-pharma">Saudi Pharma</option></select></label>
</header>
<main>
<figure><figcaption>English</figcaption><iframe id="en" title="English site" src="../index.html?brand-check=sun1"></iframe></figure>
<figure><figcaption>العربية</figcaption><iframe id="ar" title="Arabic site" src="../index-ar.html?brand-check=sun1"></iframe></figure>
</main>
<script>
const frames=[document.querySelector('#en'),document.querySelector('#ar')];
const width=document.querySelector('#width');
function resize(){for(const frame of frames)frame.style.width=(Number(width.value)+2)+'px';}
width.addEventListener('change',resize);resize();
document.querySelector('#page').addEventListener('change',event=>{frames[0].src='../'+event.target.value+'.html?brand-check=sun1';frames[1].src='../'+event.target.value+'-ar.html?brand-check=sun1';});
</script>
</body>
</html>
