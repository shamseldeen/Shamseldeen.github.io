    <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#759386" stroke-width="1.5"/></marker>
  </defs>
  <rect width="960" height="540" fill="#eef1e8"/>
