<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Temporary footer review</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#edf1f3;color:#102a43;font:14px/1.5 system-ui}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:17px;margin:0}select{font:inherit;padding:6px}#status{margin:8px 0}iframe{display:block;height:780px;border:1px solid #b6c2c8}</style></head>
<body><header><h1>Footer review</h1><label>Page <select id="page"><option value="index-ar.html">Arabic home</option><option value="index.html">English home</option><option value="learning-ar.html">Arabic learning</option><option value="learning.html">English learning</option><option value="nutrition-ar.html">Arabic nutrition</option><option value="nutrition.html">English nutrition</option><option value="nutrition-analysis-ar.html">Arabic analysis</option><option value="nutrition-analysis.html">English analysis</option><option value="saudi-pharma-ar.html">Arabic Power BI</option><option value="saudi-pharma.html">English Power BI</option></select></label><label>Width <select id="width"><option>320</option><option selected>390</option><option>850</option><option>1366</option></select></label></header><p id="status">Loading</p><iframe id="preview" title="Responsive footer preview"></iframe>
<script>
const preview=document.querySelector('#preview'),page=document.querySelector('#page'),width=document.querySelector('#width'),status=document.querySelector('#status');
function measure(){const d=preview.contentDocument,w=preview.contentWindow,f=d.querySelector('.site-footer'),links=[...f.querySelectorAll('.contact-icon-link')];w.scrollTo({top:d.documentElement.scrollHeight,behavior:'instant'});status.textContent=JSON.stringify({page:page.value,width:w.innerWidth,links:links.map(a=>a.textContent.trim()),minHeight:Math.min(...links.map(a=>a.getBoundingClientRect().height)),icons:links.filter(a=>w.getComputedStyle(a,'::before').backgroundImage!=='none').length,visiblePhone:/595396073/.test(f.textContent),overflow:d.documentElement.scrollWidth-d.documentElement.clientWidth});}
function resize(){preview.style.width=(Number(width.value)+2)+'px';requestAnimationFrame(()=>requestAnimationFrame(measure));}preview.onload=async()=>{await preview.contentDocument.fonts.ready;resize();};page.addEventListener('change',()=>{status.textContent='Loading';preview.src=page.value+'?review=footer1';});width.addEventListener('change',resize);preview.style.width=(Number(width.value)+2)+'px';preview.src='index-ar.html?review=footer1';
</script></body></html>
