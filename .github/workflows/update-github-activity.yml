name: Update "Latest on GitHub"

# Refreshes github-activity.json once a day, and on demand from the Actions tab.
# Only repositories with the topic "portfolio" appear on the site.
on:
  schedule:
    - cron: "17 3 * * *"   # 06:17 Riyadh time, every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-activity
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build github-activity.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_github_activity.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- github-activity.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-activity.json
          git commit -m "Update Latest on GitHub"
          git push
